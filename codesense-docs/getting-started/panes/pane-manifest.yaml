# pane-manifest.yaml — ambient right-pane registration for the docs org.
#
# Shape:
#   version:   schema version (bumped when the viewer changes the registration contract).
#   panes[].id:                 stable key; used in localStorage for collapse state.
#   panes[].title:              shown in the pane's own header AND the pane-picker chip.
#   panes[].html:               filename inside this `panes/` dir, relative to the manifest.
#   panes[].icon:               Lucide name; the pane's inline <script> uses the same key.
#   panes[].showsOn:            CodeSense pane-context taxonomy. "*" = always; otherwise one
#                               or more of: viewer:html, viewer:markdown, viewer:excalidraw,
#                               agents:detail, agents:list, inbox:thread, inbox:list,
#                               pipeline:story, pipeline:epic, pipeline:sprint,
#                               terminals:detail, routines:detail, routines:run,
#                               worktrees:detail, pane:*.
#   panes[].priority:           lower = closer to the top of the stack. ties broken by id.
#   panes[].collapsedByDefault: start folded; the user expands when they want it.
#   panes[].reactsTo:           optional, lists subscribeContext payload keys the pane
#                               actively watches (purely informational — enables build-time
#                               lint and the primitives-explorer "which panes care about
#                               this surface?" view). Must be a subset of what
#                               window.codesense.kit publishes.
#
# Build-time lints:
#   - every pane entry has a matching HTML file under getting-started/panes/.
#   - every pane HTML passes the primitives inventory check (allowlisted bridge verbs only).
#   - every showsOn key resolves against the registered pane-context taxonomy.
#   - priorities are unique within a showsOn bucket.

version: 1

panes:
  # Always-on, folded. Opens on demand; the lowest-noise entrypoint.
  - id: tutor
    title: "Tutor"
    html: tutor.html
    icon: graduation-cap
    showsOn: ["*"]
    priority: 100
    collapsedByDefault: true
    reactsTo: [surface, workspace, team, selection]

  # The headline "what am I looking at" pane. Pinned near the top on every viewer surface.
  - id: explain-this-surface
    title: "Explain this surface"
    html: explain-this-surface.html
    icon: scan-text
    showsOn:
      - viewer:markdown
      - viewer:html
      - viewer:excalidraw
      - agents:detail
      - inbox:thread
    priority: 10
    collapsedByDefault: false
    reactsTo: [surface, filepath, agentId, messageId]

  # Contextual next-move list, tied to the SDLC phase.
  - id: try-these-next
    title: "Try these next"
    html: try-these-next.html
    icon: arrow-right-to-line
    showsOn: ["*"]
    priority: 30
    collapsedByDefault: false
    reactsTo: [surface, sdlcPhase, storyStatus]
