<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="cs:type" content="dashboard" />
    <meta name="codesense:icon" content="file-code" />
    <title>CodeSense — Schemas</title>

    <!-- Shared docs chrome: tokens, shell, top-nav, ⌘K palette. The shared chrome locks
         the bundled location at ./_shared/. -->
    <link rel="stylesheet" href="./_shared/cs-docs.css" />
    <script src="./_shared/nav.js" defer></script>
    <!-- create-repo primer: `window.codesense.docs` → mountInlineAffordance /
         hasEditableRepo. We only reach for it when a "save back" affordance
         (not the validator itself) needs an editable context repo. -->
    <script src="./_shared/create-repo-primer.js" defer></script>

    <!--
      schema-browser.html
      ──────────────────────────────────────────────────────────────────────
      Reference explorer: every YAML / frontmatter / JSON file CodeSense
      parses, with field table + example + inline live validator. One page,
      one truth, two seconds from paste to green bar.

      Data source
        ./generated/schemas.json — produced by scripts/generate-yaml-schemas.mjs.
        One entry per schema (agent.yaml, routine.yml, teams.yml, org.yml,
        worktree.yaml, bundle.json, story frontmatter, epic frontmatter).

      Validator
        Debounced ~120ms. Prefers window.codesense.invoke('validateYaml', {kind,
        text}); falls back to a client-side subset-sufficient parser so the
        page is useful on a fresh install (no editable repo yet).
        AC-2: validator always works client-side; any "save back" affordance
        routes through the create-repo primer.

      Deep-link
        schema-browser.html#schema/<slug> — selects + scrolls that row on load
        (e.g. referenced from arc-a-first-touch/create.html).

      Reduced motion
        Status-badge crossfades and smooth-scroll both respect
        prefers-reduced-motion. No motion is load-bearing.
    -->

    <style>
      /* -----------------------------------------------------------------
       * schema-browser — local styles. Scoped `cs-schema-*` so they can
       * promote to _shared/cs-docs.css later via copy-paste. The shell
       * (cs-topnav, cs-main, cs-footer) is inherited from the shared
       * stylesheet; everything below is additive.
       * ----------------------------------------------------------------- */

      :root {
        /* YAML syntax highlighting — one palette, not a rainbow. */
        --yaml-key: var(--cs-fg);
        --yaml-string: color-mix(in srgb, var(--cs-accent) 72%, var(--cs-fg) 28%);
        --yaml-number: var(--cs-muted-fg);
        --yaml-boolean: var(--cs-muted-fg);
        --yaml-null: var(--cs-subtle-fg);
        --yaml-comment: var(--cs-subtle-fg);
        --yaml-punct: var(--cs-muted-fg);
      }

      body.cs-schema {
        margin: 0;
        background: var(--cs-bg);
        color: var(--cs-fg);
        font-family: var(--cs-font-sans);
      }

      /* 3-row shell: top-nav (shared) / main / footer. */
      .cs-schema-app {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: calc(100vh - var(--cs-docs-nav-height, 48px));
      }

      .cs-schema-main {
        display: grid;
        grid-template-columns: minmax(280px, 340px) 1fr;
        min-height: 0;
        max-width: var(--cs-docs-content-max, 1240px);
        margin: 0 auto;
        width: 100%;
        padding: 0 var(--cs-docs-space-4) 0;
      }
      @media (max-width: 820px) {
        .cs-schema-main {
          grid-template-columns: 1fr;
          padding: 0;
        }
      }

      /* ---------- Left: filter rail + list. */
      .cs-schema-list-col {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        border-right: 1px solid var(--cs-border);
        background: var(--cs-inset);
      }
      @media (max-width: 820px) {
        .cs-schema-list-col {
          border-right: 0;
          border-bottom: 1px solid var(--cs-border);
        }
      }

      .cs-schema-filters {
        display: flex;
        flex-direction: column;
        gap: var(--cs-docs-space-2);
        padding: var(--cs-docs-space-3);
        border-bottom: 1px solid var(--cs-border);
        background: var(--cs-inset);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .cs-schema-search {
        display: flex;
        align-items: center;
        gap: var(--cs-docs-space-2);
        padding: 0 var(--cs-docs-space-2) 0 var(--cs-docs-space-3);
        height: 34px;
        border-radius: var(--cs-docs-radius-sm);
        background: var(--cs-surface);
        border: 1px solid var(--cs-border);
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease;
      }
      .cs-schema-search:focus-within {
        border-color: var(--cs-accent);
        box-shadow: 0 0 0 3px var(--cs-accent-soft);
      }
      .cs-schema-search svg {
        width: 14px;
        height: 14px;
        color: var(--cs-muted-fg);
        flex: none;
      }
      .cs-schema-search input {
        flex: 1 1 auto;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--cs-fg);
        font-size: var(--cs-docs-text-sm);
        font-family: inherit;
      }
      .cs-schema-search input::placeholder {
        color: var(--cs-subtle-fg);
      }
      .cs-schema-search .kbd {
        font: 500 10.5px/1 var(--cs-font-mono);
        color: var(--cs-muted-fg);
        padding: 2px 6px;
        border: 1px solid var(--cs-border);
        border-bottom-width: 2px;
        border-radius: 4px;
        background: var(--cs-inset-strong);
        flex: none;
      }

      .cs-schema-seg {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--cs-border);
        background: var(--cs-surface);
        border-radius: var(--cs-docs-radius-sm);
        gap: 1px;
      }
      .cs-schema-seg button {
        padding: 4px 10px;
        border: 0;
        background: transparent;
        color: var(--cs-muted-fg);
        font-size: var(--cs-docs-text-xs);
        font-weight: 500;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
      }
      .cs-schema-seg button[aria-pressed="true"] {
        background: var(--cs-fg);
        color: var(--cs-bg);
      }

      /* The list itself. */
      .cs-schema-list {
        overflow-y: auto;
        padding-bottom: var(--cs-docs-space-5);
      }
      .cs-schema-group-head {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: var(--cs-docs-space-2);
        padding: 12px var(--cs-docs-space-3) 6px;
        background: var(--cs-inset);
        border-bottom: 1px solid var(--cs-border);
        z-index: 1;
      }
      .cs-schema-group-head .label {
        font: 600 10px/1 var(--cs-font-sans);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--cs-muted-fg);
      }
      .cs-schema-group-head .count {
        margin-left: auto;
        font-size: 10px;
        color: var(--cs-subtle-fg);
        font-variant-numeric: tabular-nums;
      }

      .cs-schema-row {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        align-items: center;
        column-gap: var(--cs-docs-space-2);
        padding: 8px 12px 8px 13px;
        cursor: pointer;
        position: relative;
        border-left: 3px solid transparent;
        min-height: 36px;
      }
      .cs-schema-row:hover {
        background: var(--cs-hover);
      }
      .cs-schema-row[aria-selected="true"] {
        background: color-mix(in srgb, var(--cs-accent) 10%, transparent);
        border-left-color: var(--cs-accent);
      }
      .cs-schema-row .r-ico {
        width: 16px;
        height: 16px;
        color: var(--cs-muted-fg);
        flex: none;
      }
      .cs-schema-row[aria-selected="true"] .r-ico {
        color: var(--cs-accent);
      }
      .cs-schema-row .name {
        font: 500 var(--cs-docs-text-sm)/1.3 var(--cs-font-mono);
        color: var(--cs-fg);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        letter-spacing: -0.005em;
      }
      .cs-schema-row .name mark {
        background: color-mix(in srgb, var(--cs-accent) 25%, transparent);
        color: inherit;
        padding: 0 1px;
        border-radius: 2px;
      }
      .cs-schema-row .sub {
        grid-column: 2 / 3;
        font: 400 10.5px/1.3 var(--cs-font-mono);
        /* WCAG 2.1 AA. */
        color: var(--cs-muted-fg);
        font-variant-numeric: tabular-nums;
      }
      .cs-schema-row[aria-selected="true"] .sub {
        color: var(--cs-muted-fg);
      }
      .cs-schema-row .r-rec {
        display: inline-flex;
        align-items: center;
        min-width: 32px;
        justify-content: flex-end;
        font: 500 11px/1 var(--cs-font-mono);
        color: var(--cs-muted-fg);
        font-variant-numeric: tabular-nums;
        gap: 3px;
      }

      /* ---------- Right: detail. */
      .cs-schema-detail-col {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        background: var(--cs-bg);
      }
      @media (max-width: 820px) {
        .cs-schema-detail-col {
          position: fixed;
          inset: var(--cs-docs-nav-height, 48px) 0 0 0;
          z-index: 10;
          transform: translateX(100%);
          transition: transform 180ms ease;
          background: var(--cs-bg);
          border-left: 1px solid var(--cs-border);
          box-shadow: var(--cs-docs-shadow-sheet, 0 0 0 transparent);
        }
        .cs-schema-app[data-detail-open="true"] .cs-schema-detail-col {
          transform: translateX(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cs-schema-detail-col {
          transition: none;
        }
      }

      .cs-schema-detail-head {
        position: sticky;
        top: 0;
        padding: var(--cs-docs-space-4) var(--cs-docs-space-5) var(--cs-docs-space-3);
        border-bottom: 1px solid var(--cs-border);
        background: var(--cs-bg);
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: start;
        gap: var(--cs-docs-space-3);
        z-index: 2;
      }
      .cs-schema-detail-head h1 {
        margin: 0 0 4px;
        font: 600 20px/1.2 var(--cs-font-mono);
        letter-spacing: -0.01em;
        color: var(--cs-fg);
      }
      .cs-schema-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--cs-docs-space-2) var(--cs-docs-space-3);
        font-size: var(--cs-docs-text-xs);
        color: var(--cs-muted-fg);
      }
      .cs-schema-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--cs-inset-strong);
        color: var(--cs-muted-fg);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .cs-schema-pill.kind-yaml {
        color: var(--cs-accent);
        background: var(--cs-accent-soft);
      }
      .cs-schema-pill.kind-frontmatter {
        color: var(--cs-success, #3fb950);
        background: color-mix(in srgb, var(--cs-success, #3fb950) 10%, transparent);
      }
      .cs-schema-pill.kind-json {
        color: var(--cs-warning, #d29922);
        background: color-mix(in srgb, var(--cs-warning, #d29922) 10%, transparent);
      }
      .cs-schema-meta a {
        color: var(--cs-muted-fg);
        text-decoration: underline;
        text-decoration-color: var(--cs-border-strong);
        text-underline-offset: 2px;
        text-decoration-thickness: 1px;
        font-variant-numeric: tabular-nums;
        font-family: var(--cs-font-mono);
      }
      .cs-schema-meta a:hover {
        color: var(--cs-fg);
        text-decoration-color: var(--cs-accent);
      }
      .cs-schema-meta .nums strong {
        color: var(--cs-fg);
        font-weight: 600;
      }

      .cs-schema-cta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 12px;
        background: var(--cs-fg);
        color: var(--cs-bg);
        border: 0;
        border-radius: var(--cs-docs-radius-sm);
        font-size: var(--cs-docs-text-sm);
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      .cs-schema-cta:hover {
        background: color-mix(in srgb, var(--cs-fg) 85%, var(--cs-accent) 15%);
      }
      .cs-schema-cta svg {
        width: 13px;
        height: 13px;
      }

      .cs-schema-btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        background: transparent;
        color: var(--cs-muted-fg);
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-docs-radius-sm);
        font-size: var(--cs-docs-text-xs);
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      .cs-schema-btn-ghost:hover {
        color: var(--cs-fg);
        border-color: var(--cs-border-strong);
      }
      .cs-schema-btn-ghost svg {
        width: 11px;
        height: 11px;
      }

      .cs-schema-detail-body {
        overflow-y: auto;
        padding: var(--cs-docs-space-4) var(--cs-docs-space-5) var(--cs-docs-space-6);
      }

      .cs-schema-desc {
        color: var(--cs-fg);
        max-width: 72ch;
        font-size: var(--cs-docs-text-md);
        margin: 0 0 var(--cs-docs-space-5);
      }
      .cs-schema-path {
        display: inline-block;
        margin: 0 0 var(--cs-docs-space-5);
        padding: 4px 8px;
        background: var(--cs-inset);
        border: 1px solid var(--cs-border);
        border-radius: 4px;
        font: var(--cs-docs-text-xs)/1.4 var(--cs-font-mono);
        color: var(--cs-muted-fg);
      }
      .cs-schema-path strong {
        color: var(--cs-fg);
        font-weight: 500;
      }

      .cs-schema-section {
        margin: 0 0 var(--cs-docs-space-5);
      }
      .cs-schema-section-head {
        display: flex;
        align-items: baseline;
        gap: var(--cs-docs-space-2);
        margin: 0 0 var(--cs-docs-space-3);
      }
      .cs-schema-section-head .l {
        font: 600 10px/1 var(--cs-font-sans);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--cs-muted-fg);
      }
      .cs-schema-section-head .hint {
        /* WCAG 2.1 AA. */
        color: var(--cs-muted-fg);
        font-size: var(--cs-docs-text-xs);
      }

      /* ---------- Fields table. */
      .cs-schema-fields {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: var(--cs-docs-text-sm);
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-docs-radius-sm);
        overflow: hidden;
        background: var(--cs-surface);
      }
      .cs-schema-fields thead th {
        text-align: left;
        padding: 7px 12px;
        background: var(--cs-inset);
        border-bottom: 1px solid var(--cs-border);
        font: 600 10px/1 var(--cs-font-sans);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--cs-muted-fg);
        white-space: nowrap;
      }
      .cs-schema-fields tbody td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--cs-border);
        vertical-align: top;
        line-height: 1.45;
      }
      .cs-schema-fields tbody tr:last-child td {
        border-bottom: 0;
      }
      .cs-schema-fields tbody tr:hover td {
        background: var(--cs-hover);
      }
      .cs-schema-fields tbody tr.required td {
        background: color-mix(in srgb, var(--cs-danger, #f85149) 3%, transparent);
      }
      .cs-schema-fields td.c-name {
        font: 500 var(--cs-docs-text-sm)/1.4 var(--cs-font-mono);
        color: var(--cs-fg);
        white-space: nowrap;
        letter-spacing: -0.005em;
      }
      .cs-schema-fields tr.required td.c-name {
        font-weight: 600;
      }
      .cs-schema-fields td.c-type {
        font: 400 var(--cs-docs-text-xs)/1.4 var(--cs-font-mono);
        color: var(--cs-muted-fg);
        white-space: nowrap;
      }
      .cs-schema-fields td.c-req {
        text-align: center;
        width: 50px;
        white-space: nowrap;
      }
      .cs-schema-fields td.c-req .yes {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--cs-danger, #f85149) 15%, transparent);
        color: var(--cs-danger, #f85149);
        font-size: 11px;
        font-weight: 700;
      }
      .cs-schema-fields td.c-req .no {
        color: var(--cs-subtle-fg);
        font-size: 11px;
      }
      .cs-schema-fields td.c-default {
        font: 400 var(--cs-docs-text-xs)/1.4 var(--cs-font-mono);
        color: var(--cs-muted-fg);
        white-space: nowrap;
      }
      .cs-schema-fields td.c-default code {
        color: var(--cs-fg);
        background: var(--cs-inset);
        padding: 1px 5px;
        border-radius: 3px;
      }
      .cs-schema-fields td.c-default .none {
        /* WCAG 2.1 AA. */
        color: var(--cs-muted-fg);
        font-style: italic;
        font-family: var(--cs-font-sans);
        font-size: var(--cs-docs-text-xs);
      }
      .cs-schema-fields td.c-allowed {
        font-size: var(--cs-docs-text-xs);
      }
      .cs-schema-fields td.c-allowed .chip {
        display: inline-block;
        margin: 0 3px 3px 0;
        padding: 1px 6px;
        background: var(--cs-inset-strong);
        color: var(--cs-fg);
        border: 1px solid var(--cs-border);
        border-radius: 4px;
        font-family: var(--cs-font-mono);
        font-size: 10.5px;
        line-height: 1.5;
      }
      .cs-schema-fields td.c-allowed .chip.pattern {
        background: transparent;
        color: var(--cs-muted-fg);
        max-width: 30ch;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cs-schema-fields td.c-allowed .none {
        /* WCAG 2.1 AA. */
        color: var(--cs-muted-fg);
      }
      .cs-schema-fields td.c-desc {
        color: var(--cs-muted-fg);
        max-width: 48ch;
        font-size: var(--cs-docs-text-sm);
      }
      .cs-schema-fields td.c-desc .srcref {
        display: inline-block;
        margin-left: 6px;
        font: var(--cs-docs-text-xs)/1 var(--cs-font-mono);
        /* WCAG 2.1 AA. */
        color: var(--cs-muted-fg);
        text-decoration: underline;
        text-decoration-color: var(--cs-border-strong);
        text-underline-offset: 2px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .cs-schema-fields td.c-desc .srcref:hover {
        color: var(--cs-fg);
        text-decoration-color: var(--cs-accent);
      }

      /* ---------- Example YAML block. */
      .cs-schema-yaml-wrap {
        position: relative;
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-docs-radius-sm);
        background: var(--cs-inset);
        overflow: hidden;
      }
      .cs-schema-yaml-wrap .copy {
        position: absolute;
        top: 8px;
        right: 8px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 9px;
        background: var(--cs-surface);
        color: var(--cs-muted-fg);
        border: 1px solid var(--cs-border);
        border-radius: 4px;
        font: 500 var(--cs-docs-text-xs)/1 var(--cs-font-sans);
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 120ms ease,
          color 120ms ease,
          border-color 120ms ease;
      }
      @media (prefers-reduced-motion: reduce) {
        .cs-schema-yaml-wrap .copy {
          transition: none;
        }
      }
      .cs-schema-yaml-wrap:hover .copy,
      .cs-schema-yaml-wrap:focus-within .copy {
        opacity: 1;
      }
      .cs-schema-yaml-wrap .copy:hover {
        color: var(--cs-accent);
        border-color: var(--cs-accent);
      }
      .cs-schema-yaml-wrap .copy svg {
        width: 11px;
        height: 11px;
      }
      pre.cs-schema-yaml {
        margin: 0;
        padding: var(--cs-docs-space-4);
        overflow-x: auto;
        font: var(--cs-docs-text-sm)/1.6 var(--cs-font-mono);
        color: var(--cs-fg);
        white-space: pre;
        tab-size: 2;
      }
      pre.cs-schema-yaml .yk {
        color: var(--yaml-key);
      }
      pre.cs-schema-yaml .ys {
        color: var(--yaml-string);
      }
      pre.cs-schema-yaml .yn {
        color: var(--yaml-number);
      }
      pre.cs-schema-yaml .yb {
        color: var(--yaml-boolean);
        font-weight: 500;
      }
      pre.cs-schema-yaml .yl {
        color: var(--yaml-null);
        font-style: italic;
      }
      pre.cs-schema-yaml .yc {
        color: var(--yaml-comment);
        font-style: italic;
      }
      pre.cs-schema-yaml .yp {
        color: var(--yaml-punct);
      }
      pre.cs-schema-yaml .yd {
        color: var(--yaml-punct);
      }

      /* ---------- Validator — the centerpiece. */
      .cs-schema-validator {
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-docs-radius-sm);
        background: var(--cs-surface);
        overflow: hidden;
      }
      .cs-schema-validator .v-head {
        display: flex;
        align-items: center;
        gap: var(--cs-docs-space-2);
        padding: 10px var(--cs-docs-space-3);
        background: var(--cs-inset);
        border-bottom: 1px solid var(--cs-border);
      }
      .cs-schema-validator .v-head .l {
        font: 600 10px/1 var(--cs-font-sans);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--cs-muted-fg);
      }
      .cs-schema-validator .v-head .hint {
        /* WCAG 2.1 AA. */
        color: var(--cs-muted-fg);
        font-size: var(--cs-docs-text-xs);
      }
      .cs-schema-validator .v-head .actions {
        margin-left: auto;
        display: inline-flex;
        gap: 6px;
      }
      .cs-schema-validator .v-body {
        position: relative;
        display: grid;
        grid-template-columns: 42px 1fr;
        min-height: 180px;
      }
      .cs-schema-gutter {
        padding: 10px 8px 10px 10px;
        background: var(--cs-inset);
        border-right: 1px solid var(--cs-border);
        font: var(--cs-docs-text-sm)/1.6 var(--cs-font-mono);
        /* WCAG 2.1 AA. */
        color: var(--cs-muted-fg);
        font-variant-numeric: tabular-nums;
        user-select: none;
        text-align: right;
        white-space: pre;
        overflow: hidden;
      }
      .cs-schema-gutter .gline {
        display: block;
        position: relative;
        padding-right: 6px;
      }
      .cs-schema-gutter .gline.err {
        color: var(--cs-danger, #f85149);
        font-weight: 600;
      }
      .cs-schema-gutter .gline.err::before {
        content: "";
        position: absolute;
        left: -1px;
        top: 2px;
        bottom: 2px;
        width: 2px;
        background: var(--cs-danger, #f85149);
        border-radius: 2px;
      }
      .cs-schema-validator textarea {
        display: block;
        width: 100%;
        resize: vertical;
        min-height: 180px;
        max-height: 420px;
        padding: 10px 12px;
        border: 0;
        outline: 0;
        background: var(--cs-surface);
        color: var(--cs-fg);
        font: var(--cs-docs-text-sm)/1.6 var(--cs-font-mono);
        tab-size: 2;
        white-space: pre;
        overflow-x: auto;
        caret-color: var(--cs-accent);

      .cs-schema-validator textarea::placeholder {
        color: var(--cs-subtle-fg);
        font-style: italic;
      }

      .cs-schema-v-foot {
        display: flex;
        align-items: center;
        gap: var(--cs-docs-space-2);
        padding: 8px var(--cs-docs-space-3);
        border-top: 1px solid var(--cs-border);
        font-size: var(--cs-docs-text-xs);
        background: var(--cs-inset);
      }
      .cs-schema-v-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 10.5px;
      }
      .cs-schema-v-status .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--cs-border-strong);
        box-shadow: 0 0 0 3px var(--cs-inset);
        transition:
          background 180ms ease,
          box-shadow 180ms ease;
      }
      .cs-schema-v-status[data-state="idle"] {
        color: var(--cs-subtle-fg);
      }
      .cs-schema-v-status[data-state="ok"] {
        color: var(--cs-success, #3fb950);
      }
      .cs-schema-v-status[data-state="ok"] .dot {
        background: var(--cs-success, #3fb950);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--cs-success, #3fb950) 15%, transparent);
      }
      .cs-schema-v-status[data-state="err"] {
        color: var(--cs-danger, #f85149);
      }
      .cs-schema-v-status[data-state="err"] .dot {
        background: var(--cs-danger, #f85149);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--cs-danger, #f85149) 15%, transparent);
      }
      .cs-schema-v-status[data-state="working"] .dot {
        background: var(--cs-accent);
        box-shadow: 0 0 0 3px var(--cs-accent-soft);

      @media (prefers-reduced-motion: reduce) {
        .cs-schema-v-status .dot {

      .cs-schema-v-foot .elapsed {
        color: var(--cs-muted-fg);
        font-variant-numeric: tabular-nums;
        margin-left: var(--cs-docs-space-2);

      .cs-schema-v-foot .via {
        margin-left: auto;

      .cs-schema-v-errors {
        display: none;
        border-top: 1px solid var(--cs-border);

      .cs-schema-v-errors[data-count]:not([data-count="0"]) {

      .cs-schema-err-row {
        display: grid;

        border-bottom: 1px solid var(--cs-border);

        text-align: left;

      .cs-schema-err-row:hover {

      }
      .cs-schema-err-row .loc {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font: 500 var(--cs-docs-text-xs)/1 var(--cs-font-mono);
        color: var(--cs-danger, #f85149);
        font-variant-numeric: tabular-nums;
        background: color-mix(in srgb, var(--cs-danger, #f85149) 12%, transparent);
        padding: 3px 7px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .cs-schema-err-row .msg {
        color: var(--cs-fg);
        font-size: var(--cs-docs-text-sm);
      }
      .cs-schema-err-row .msg code {
        background: var(--cs-inset);
        padding: 1px 5px;
        border-radius: 3px;

      .cs-schema-err-row .nav {

      .cs-schema-err-row .nav svg {

        height: 12px;
      }

      /* "Save back to context repo" affordance under the validator. Hidden

      .cs-schema-save-back {
        display: flex;
        align-items: center;

      /* ---------- Empty detail state. */
      .cs-schema-empty-detail {

        padding: var(--cs-docs-space-6);

  <body class="cs-page cs-docs cs-schema" data-page="schema-browser">
    <!-- Shared top-nav mounts here (nav.js). -->
    <nav class="cs-topnav" data-cs-nav></nav>

    <div class="cs-schema-app" id="cs-schema-app" data-detail-open="false">
      <main class="cs-schema-main">
        <aside class="cs-schema-list-col" aria-label="Schema list">
          <div class="cs-schema-filters">
            <label class="cs-schema-search" aria-label="Search schemas">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
              </svg>
              <input
                id="cs-schema-q"
                type="search"
                placeholder="Search schemas…"
                autocomplete="off"
                spellcheck="false"
              />
              <span class="kbd">/</span>
            </label>
            <div class="cs-schema-seg" role="group" aria-label="Filter by kind">
              <button type="button" data-kind="" aria-pressed="true">All</button>
              <button type="button" data-kind="yaml" aria-pressed="false">YAML</button>
              <button type="button" data-kind="frontmatter" aria-pressed="false">
                Frontmatter
              </button>
              <button type="button" data-kind="json" aria-pressed="false">JSON</button>
            </div>
          </div>

          <div class="cs-schema-list" id="cs-schema-list" role="listbox" aria-label="Schemas">
            <div class="cs-schema-notice" data-cs-loading>
              Loading <code>generated/schemas.json</code>…
            </div>
          </div>
        </aside>

        <article class="cs-schema-detail-col" aria-label="Schema detail">
          <div id="cs-schema-detail">
            <div class="cs-schema-empty-detail">
              <div class="big">⌁</div>
              <p class="hint">
                Press <span class="kbd">/</span> and start typing. <br />
                Or deep-link <span class="kbd">schema-browser.html#schema/&lt;slug&gt;</span>.
              </p>
            </div>
          </div>
        </article>
      </main>

      <footer class="cs-schema-footer" role="contentinfo">
        <div class="legend">
          <span><span class="kbd">/</span> search</span>
          <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
          <span><span class="kbd">↵</span> validate</span>
          <span><span class="kbd">Esc</span> close</span>
        </div>
        <span class="r" id="cs-schema-foot-count"></span>
      </footer>
    </div>

    <script>
      /* ============================================================
       * schema-browser · production
       *
       * Loads SCHEMAS from ./generated/schemas.json (produced by
       * scripts/generate-yaml-schemas.mjs). Falls back to a client-side
       * subset-sufficient validator so the page works on a fresh install
       * (no editable repo yet); prefers window.codesense.invoke('validateYaml',
       * { kind, text }) when the bridge is available.
       * ============================================================ */

      "use strict";

      var KIND_LABEL = { yaml: "YAML", frontmatter: "Frontmatter", json: "JSON" };

      var ICON = {
        "file-code":
          '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m10 13-2 2 2 2"/><path d="m14 17 2-2-2-2"/>',
        user: '<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',
        clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
        building:
          '<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>',
        users:
          '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        "git-branch":
          '<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
        "book-open":
          '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
        "book-marked":
          '<path d="M10 2v8l3-3 3 3V2"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
        package:
          '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>',
        copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
        trash:
          '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
        "chevron-right": '<polyline points="9 18 15 12 9 6"/>',
        "arrow-right": '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
      };

      function icon(name, attrs) {
        attrs = attrs || {};
        var defaults = {
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          "stroke-width": "2",
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
        };
        var merged = Object.assign({}, defaults, attrs);
        var attrStr = Object.keys(merged)
          .map(function (k) {
            return k + '="' + merged[k] + '"';
          })
          .join(" ");
        return "<svg " + attrStr + ' aria-hidden="true">' + (ICON[name] || "") + "</svg>";
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function $(id) {
        return document.getElementById(id);
      }

      function h(tag, attrs) {
        var el = document.createElement(tag);
        if (attrs) {
          Object.keys(attrs).forEach(function (k) {
            var v = attrs[k];
            if (v == null || v === false) return;
            if (k === "class") el.className = v;
            else if (k === "html") el.innerHTML = v;
            else if (k === "onclick") el.addEventListener("click", v);
            else if (k === "oninput") el.addEventListener("input", v);
            else if (k === "onkeydown") el.addEventListener("keydown", v);
            else el.setAttribute(k, v);
          });
        }
        for (var i = 2; i < arguments.length; i++) {
          var child = arguments[i];
          if (child == null || child === false) continue;
          if (Array.isArray(child)) {
            child.forEach(function (c) {
              if (c == null) return;
              el.append(c.nodeType ? c : document.createTextNode(String(c)));
            });
          } else {
            el.append(child.nodeType ? child : document.createTextNode(String(child)));
          }
        }
        return el;
      }

      /* ============================================================
       * State
       * ============================================================ */
      var SCHEMAS = [];
      var state = {
        q: "",
        kind: "",
        selected: null,
        filtered: [],
      };

      /* ============================================================
       * Data load
       * ============================================================ */
      function loadSchemas() {
        return fetch("./generated/schemas.json", { credentials: "same-origin", cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (doc) {
            if (!doc || !Array.isArray(doc.schemas)) {
              throw new Error("malformed schemas.json");
            }
            SCHEMAS = doc.schemas;
            state.filtered = SCHEMAS.slice();
            renderList();
            fromHash();
          })
          .catch(function (err) {
            var list = $("cs-schema-list");
            list.innerHTML =
              '<div class="cs-schema-notice">Could not fetch <code>generated/schemas.json</code> (' +
              esc(err && err.message ? err.message : String(err)) +
              "). Open this page inside CodeSense or the dev viewer.</div>";
          });
      }

      /* ============================================================
       * List render
       * ============================================================ */
      function applyFilters() {
        var q = state.q.trim().toLowerCase();
        state.filtered = SCHEMAS.filter(function (s) {
          if (state.kind && s.kind !== state.kind) return false;
          if (!q) return true;
          var fieldNames = s.fields
            .map(function (f) {
              return f.name;
            })
            .join(" ");
          var hay = (s.name + " " + s.description + " " + fieldNames).toLowerCase();
          return hay.indexOf(q) !== -1;
        });
        updateCounts();
      }

      function updateCounts() {
        var el = $("cs-schema-foot-count");
        if (el) el.textContent = state.filtered.length + "/" + SCHEMAS.length + " showing";
      }

      function highlight(text, q) {
        if (!q) return esc(text);
        var i = text.toLowerCase().indexOf(q.toLowerCase());
        if (i < 0) return esc(text);
        return (
          esc(text.slice(0, i)) +
          "<mark>" +
          esc(text.slice(i, i + q.length)) +
          "</mark>" +
          esc(text.slice(i + q.length))
        );
      }

      function renderList() {
        var target = $("cs-schema-list");
        target.innerHTML = "";
        var groups = { yaml: [], frontmatter: [], json: [] };
        state.filtered.forEach(function (s) {
          if (groups[s.kind]) groups[s.kind].push(s);
        });

        var order = ["yaml", "frontmatter", "json"];
        order.forEach(function (kind) {
          var items = groups[kind];
          if (!items.length) return;
          var head = h(
            "div",
            { class: "cs-schema-group-head", "data-kind": kind },
            h("span", { class: "label" }, KIND_LABEL[kind]),
            h("span", { class: "count" }, String(items.length)),
          );
          target.append(head);
          items.forEach(function (s) {
            var fc = s.fields.length;
            var rc = s.fields.filter(function (f) {
              return f.required;
            }).length;
            var row = h("div", {
              class: "cs-schema-row",
              role: "option",
              "data-slug": s.slug,
              "aria-selected": s.slug === state.selected ? "true" : "false",
              tabindex: "0",
              onclick: function () {
                select(s.slug);
              },
              onkeydown: function (e) {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  select(s.slug);
                }
              },
            });
            row.innerHTML =
              '<span class="r-ico">' +
              icon(s.icon || "file-code") +
              "</span>" +
              '<span class="name">' +
              highlight(s.name, state.q) +
              "</span>" +
              '<span class="r-rec" title="' +
              fc +
              ' fields">' +
              fc +
              "f</span>" +
              '<span class="sub">' +
              fc +
              " fields · " +
              rc +
              " required</span>";
            target.append(row);
          });
        });

        if (!state.filtered.length) {
          target.append(h("div", { class: "cs-schema-notice" }, "No schemas match."));
        }
      }

      /* ============================================================
       * YAML syntax highlighting (regex-based, safe for the example subset)
       * ============================================================ */
      function highlightYaml(text) {
        var lines = text.split("\n");
        return lines
          .map(function (line) {
            // JSON-only lines (bundle.json example).
            if (/^\s*[{}\[\],]*\s*$/.test(line) && /[{}\[\]]/.test(line)) {
              return esc(line).replace(/[{}\[\]]/g, function (m) {
                return '<span class="yp">' + m + "</span>";
              });
            }
            // Full-line YAML comment.
            var commentMatch = line.match(/^(\s*)(#.*)$/);
            if (commentMatch) {
              return esc(commentMatch[1]) + '<span class="yc">' + esc(commentMatch[2]) + "</span>";
            }
            // Document marker.
            if (/^---\s*$/.test(line)) return '<span class="yd">' + esc(line) + "</span>";
            // List item with value: "- name: Backend".
            var listKV = line.match(/^(\s*)-\s+([A-Za-z0-9_][\w-]*):\s*(.*)$/);
            if (listKV) {
              var pad = listKV[1],
                k = listKV[2],
                rest = listKV[3];
              return (
                esc(pad) +
                '<span class="yp">-</span> ' +
                '<span class="yk">' +
                esc(k) +
                '</span><span class="yp">:</span>' +
                (rest ? " " + colorValue(rest) : "")
              );
            }
            // List item (plain scalar): "  - foo".
            var listItem = line.match(/^(\s*)-\s+(.*)$/);
            if (listItem) {
              return esc(listItem[1]) + '<span class="yp">-</span> ' + colorValue(listItem[2]);
            }
            // key: value.
            var kv = line.match(/^(\s*)([A-Za-z_][\w-]*|"[^"]+")(:)(\s*)(.*)$/);
            if (kv) {
              var kvPad = kv[1],
                kvK = kv[2],
                kvColon = kv[3],
                kvSp = kv[4],
                kvRest = kv[5];
              var keyHtml = /^"/.test(kvK)
                ? '<span class="ys">' + esc(kvK) + "</span>"
                : '<span class="yk">' + esc(kvK) + "</span>";
              return (
                esc(kvPad) +
                keyHtml +
                '<span class="yp">' +
                kvColon +
                "</span>" +
                esc(kvSp) +
                (kvRest ? colorValue(kvRest) : "")
              );
            }
            // JSON-ish line.
            var jsonKV = line.match(/^(\s*)("[\w-]+")\s*:\s*(.*)$/);
            if (jsonKV) {
              return (
                esc(jsonKV[1]) +
                '<span class="ys">' +
                esc(jsonKV[2]) +
                '</span><span class="yp">:</span> ' +
                colorValue(jsonKV[3])
              );
            }
            return esc(line);
          })
          .join("\n");
      }

      function colorValue(v) {
        v = v.trim();
        if (v === "") return "";
        if (v === "null" || v === "~") return '<span class="yl">' + esc(v) + "</span>";
        if (v === "true" || v === "false") return '<span class="yb">' + esc(v) + "</span>";
        if (/^-?\d+(\.\d+)?$/.test(v)) return '<span class="yn">' + esc(v) + "</span>";
        var cm = v.match(/^(.*?)(\s+#.*)$/);
        if (cm) return colorValue(cm[1]) + '<span class="yc">' + esc(cm[2]) + "</span>";
        if (/^".*"$/.test(v) || /^'.*'$/.test(v)) return '<span class="ys">' + esc(v) + "</span>";
        if (/^[{\[]/.test(v)) {
          return esc(v).replace(/[{}\[\],]/g, function (m) {
            return '<span class="yp">' + m + "</span>";
          });
        }
        if (/[,}\]]$/.test(v)) {
          var main = v.replace(/[,}\]]+$/, "");
          var tail = v.slice(main.length);
          return colorValue(main) + '<span class="yp">' + esc(tail) + "</span>";
        }
        return '<span class="ys">' + esc(v) + "</span>";
      }

      /* ============================================================
       * Detail render
       * ============================================================ */
      function renderDetail() {
        var target = $("cs-schema-detail");
        var s = null;
        for (var i = 0; i < SCHEMAS.length; i++) {
          if (SCHEMAS[i].slug === state.selected) {
            s = SCHEMAS[i];
            break;
          }
        }
        if (!s) {
          target.innerHTML =
            '<div class="cs-schema-empty-detail">' +
            '<div class="big">⌁</div>' +
            '<p class="hint">Press <span class="kbd">/</span> and start typing.</p>' +
            "</div>";
          return;
        }

        target.innerHTML = "";
        var reqCount = s.fields.filter(function (f) {
          return f.required;
        }).length;

        var head = h(
          "header",
          { class: "cs-schema-detail-head" },
          h("div", {}, h("h1", {}, s.name), buildMeta(s, reqCount)),
          h(
            "button",
            {
              class: "cs-schema-cta",
              type: "button",
              onclick: function () {
                scrollToValidator();
              },
            },
            h("span", { html: icon("chevron-right") }),
            " Validate",
          ),
        );

        var body = h("div", { class: "cs-schema-detail-body" });
        body.append(h("p", { class: "cs-schema-desc" }, s.description));
        body.append(
          h("div", {
            class: "cs-schema-path",
            html: "<strong>path:</strong> " + esc(s.path),
          }),
        );

        // Fields section.
        var fieldsSec = h(
          "section",
          { class: "cs-schema-section" },
          h(
            "div",
            { class: "cs-schema-section-head" },
            h("span", { class: "l" }, "Fields"),
            h("span", { class: "hint" }, s.fields.length + " total · " + reqCount + " required"),
          ),
          buildFieldsTable(s),
        );
        body.append(fieldsSec);

        // Example section.
        var exampleSec = h(
          "section",
          { class: "cs-schema-section" },
          h(
            "div",
            { class: "cs-schema-section-head" },
            h("span", { class: "l" }, "Example"),
            h(
              "span",
              { class: "hint" },
              "valid " + (s.kind === "json" ? "JSON" : "YAML") + " for " + s.name,
            ),
          ),
          buildExampleBlock(s),
        );
        body.append(exampleSec);

        // Validator section.
        var validatorSec = s.validator ? h(
          "section",
          { class: "cs-schema-section", id: "cs-schema-validator-section" },
          h(
            "div",
            { class: "cs-schema-section-head" },
            h("span", { class: "l" }, "Validate"),
            h("span", { class: "hint" }, "paste or edit — validates as you type"),
          ),
          buildValidator(s),
        ) : h("p", {}, "Validate role settings by saving with role_save. The JSON Schema describes the wire shape; role_save also checks the queue id, name and icon.");
        body.append(validatorSec);

        target.append(head, body);

        // Prime the validator with the example and run once.
        var ta = $("cs-schema-v-input");
        if (ta) {
          ta.value = s.example || "";
          runValidation(s);
        }
      }

      function buildMeta(s, reqCount) {
        var meta = h("div", { class: "cs-schema-meta" });
        meta.innerHTML =
          '<span class="cs-schema-pill kind-' +
          esc(s.kind) +
          '">' +
          esc(KIND_LABEL[s.kind]) +
          "</span>" +
          '<span class="nums"><strong>' +
          s.fields.length +
          "</strong> fields</span>" +
          "<span>·</span>" +
          '<span class="nums"><strong>' +
          reqCount +
          "</strong> required</span>" +
          "<span>·</span>" +
          '<a href="#" class="srcref" data-source-ref="' +
          esc(s.sourceRef) +
          '">' +
          esc(s.sourceRef) +
          "</a>";
        var link = meta.querySelector("[data-source-ref]");
        if (link) {
          link.addEventListener("click", function (e) {
            e.preventDefault();
            openSource(s.sourceRef);
          });
        }
        return meta;
      }

      function buildFieldsTable(s) {
        var table = h("table", { class: "cs-schema-fields" });
        var thead = h("thead");
        thead.innerHTML =
          "<tr>" +
          "<th>Name</th><th>Type</th><th>Req</th><th>Default</th>" +
          "<th>Allowed / Pattern</th><th>Description</th>" +
          "</tr>";
        var tbody = h("tbody");
        s.fields.forEach(function (f) {
          var allowedCell;
          if (f.allowed && f.allowed.length) {
            allowedCell = f.allowed
              .map(function (v) {
                return '<span class="chip">' + esc(v) + "</span>";
              })
              .join("");
          } else if (f.pattern) {
            allowedCell =
              '<span class="chip pattern" title="' +
              esc(f.pattern) +
              '">/' +
              esc(f.pattern) +
              "/</span>";
          } else {
            allowedCell = '<span class="none">—</span>';
          }
          var defaultCell;
          if (f.default == null) {
            defaultCell = '<span class="none">none</span>';
          } else {
            defaultCell = "<code>" + esc(f.default) + "</code>";
          }
          var descCell = esc(f.description);
          if (f.sourceRef) {
            descCell +=
              ' <a href="#" class="srcref" data-source-ref="' +
              esc(f.sourceRef) +
              '">' +
              esc(f.sourceRef) +
              "</a>";
          }
          var tr = h("tr", { class: f.required ? "required" : "" });
          tr.innerHTML =
            '<td class="c-name">' +
            esc(f.name) +
            "</td>" +
            '<td class="c-type">' +
            esc(f.type) +
            "</td>" +
            '<td class="c-req">' +
            (f.required
              ? '<span class="yes" title="required">✓</span>'
              : '<span class="no" title="optional">—</span>') +
            "</td>" +
            '<td class="c-default">' +
            defaultCell +
            "</td>" +
            '<td class="c-allowed">' +
            allowedCell +
            "</td>" +
            '<td class="c-desc">' +
            descCell +
            "</td>";
          tbody.append(tr);
        });
        table.append(thead, tbody);

        // Delegate click on source refs.
        table.addEventListener("click", function (e) {
          var link = e.target.closest("[data-source-ref]");
          if (!link) return;
          e.preventDefault();
          openSource(link.getAttribute("data-source-ref") || "");
        });

        return table;
      }

      function buildExampleBlock(s) {
        var wrap = h("div", { class: "cs-schema-yaml-wrap" });
        var pre = h("pre", { class: "cs-schema-yaml", "aria-label": "example" });
        pre.innerHTML = highlightYaml(s.example || "");
        var copyBtn = h("button", {
          class: "copy",
          type: "button",
          title: "Copy example into the validator below",
          onclick: function () {
            var ta = $("cs-schema-v-input");
            if (!ta) return;
            ta.value = s.example || "";
            ta.focus();
            runValidation(s);
            scrollToValidator();
          },
        });
        copyBtn.innerHTML = "<span>" + icon("arrow-right") + "</span> Copy to validator";
        wrap.append(pre);
        if (s.validator) wrap.append(copyBtn);
        return wrap;
      }

      /* ============================================================
       * Validator — the centerpiece.
       * ============================================================ */
      function buildValidator(s) {
        var wrap = h("div", { class: "cs-schema-validator" });

        // Head.
        var head = h("div", { class: "v-head" });
        head.innerHTML =
          '<span class="l">Validator</span>' +
          '<span class="hint">kind: <code>' +
          esc(s.validator.kind) +
          "</code></span>" +
          '<span class="actions">' +
          '<button class="cs-schema-btn-ghost" type="button" data-reset title="Reset to the example">' +
          icon("copy") +
          " Reset</button>" +
          '<button class="cs-schema-btn-ghost" type="button" data-clear title="Clear">' +
          icon("trash") +
          " Clear</button>" +
          "</span>";
        head.querySelector("[data-reset]").addEventListener("click", function () {
          var ta = $("cs-schema-v-input");
          ta.value = s.example || "";
          ta.focus();
          runValidation(s);
        });
        head.querySelector("[data-clear]").addEventListener("click", function () {
          var ta = $("cs-schema-v-input");
          ta.value = "";
          ta.focus();
          runValidation(s);
        });

        // Body.
        var body = h("div", { class: "v-body" });
        var gutter = h("div", { class: "cs-schema-gutter", id: "cs-schema-v-gutter" }, "1");
        var ta = h("textarea", {
          id: "cs-schema-v-input",
          spellcheck: "false",
          autocorrect: "off",
          autocapitalize: "off",
          placeholder:
            "paste " + (s.kind === "json" ? "JSON" : "YAML") + " here, we check it as you type…",
          "aria-label": "Validator input",
        });
        body.append(gutter, ta);

        var debounce = null;
        ta.addEventListener("input", function () {
          updateGutter(ta);
          var status = $("cs-schema-v-status");
          if (status) status.setAttribute("data-state", "working");
          clearTimeout(debounce);
          debounce = setTimeout(function () {
            runValidation(s);
          }, 120);
        });
        ta.addEventListener("scroll", function () {
          var g = $("cs-schema-v-gutter");
          if (g) g.scrollTop = ta.scrollTop;
        });

        // Foot (status).
        var foot = h("div", { class: "cs-schema-v-foot" });
        foot.innerHTML =
          '<span class="cs-schema-v-status" id="cs-schema-v-status" data-state="idle">' +
          '<span class="dot"></span><span id="cs-schema-v-status-label">Idle</span>' +
          "</span>" +
          '<span class="elapsed" id="cs-schema-v-elapsed"></span>' +
          '<span class="via" id="cs-schema-v-via">local parser</span>';

        // Errors list.
        var errs = h("div", {
          class: "cs-schema-v-errors",
          id: "cs-schema-v-errors",
          "data-count": "0",
        });

        // Save-back affordance. Hidden until a save-back is attempted; routes
        // through the create-repo primer when there's no editable context repo.
        // The affordance itself is advisory — writing a snippet back
        // to an agent.yaml belongs to a later story — but the gate is wired so
        // the fresh-install path (AC-2's "any 'save back' affordance routes
        // through the create-repo primer") is correct.
        var saveBack = h("div", { class: "cs-schema-save-back" });
        saveBack.innerHTML =
          '<span class="msg">Snippet validated. "Save back to your context repo" lands with a later story.</span>' +
          "<span data-cs-primer></span>";

        wrap.append(head, body, foot, errs, saveBack);

        setTimeout(function () {
          updateGutter(ta);
        }, 0);
        return wrap;
      }

      function updateGutter(ta, errorLines) {
        errorLines = errorLines || new Set();
        var g = $("cs-schema-v-gutter");
        if (!g) return;
        var n = Math.max(1, ta.value.split("\n").length);
        var parts = [];
        for (var i = 1; i <= n; i++) {
          var cls = errorLines.has(i) ? "gline err" : "gline";
          parts.push('<span class="' + cls + '">' + i + "</span>");
        }
        g.innerHTML = parts.join("");
      }

      function scrollToValidator() {
        var el = $("cs-schema-validator-section");
        if (!el) return;
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
        var ta = $("cs-schema-v-input");
        if (ta) ta.focus();
      }

      /* ============================================================
       * Validation
       *
       * Preference order:
       *   1. window.codesense.invoke('validateYaml', { kind, text }) — the
       *      bridge-backed Rust validator. This page adds `validateYaml` to
       *      HTML_BRIDGE_ALLOWLIST as a read-only verb (bridge-side today
       *      runs the same JS parser below; the primitives generator picks the
       *      verb up for the primitives reference, and a later story swaps
       *      in a real Rust validator).
       *   2. Local client-side parser — subset-sufficient for the shipped
       *      examples. Always available, including fresh installs with no
       *      editable context repo (AC-2).
       * ============================================================ */
      function runValidation(schema) {
        var ta = $("cs-schema-v-input");
        if (!ta) return;
        var text = ta.value;
        var status = $("cs-schema-v-status");
        var label = $("cs-schema-v-status-label");
        var elapsed = $("cs-schema-v-elapsed");
        var errsEl = $("cs-schema-v-errors");
        var via = $("cs-schema-v-via");

        if (!text.trim()) {
          status.setAttribute("data-state", "idle");
          label.textContent = "Idle";
          elapsed.textContent = "";
          errsEl.setAttribute("data-count", "0");
          errsEl.innerHTML = "";
          updateGutter(ta);
          return;
        }

        var t0 = performance.now();
        var cs = window.codesense;
        var promise;
        if (cs && typeof cs.invoke === "function") {
          promise = cs
            .invoke("validateYaml", { kind: schema.validator.kind, text: text })
            .then(function (res) {
              if (via) via.textContent = "window.codesense · live";
              return res;
            })
            .catch(function () {
              // Bridge missing / verb not allowlisted / handler error → fall back
              // to the local parser so the page stays useful.
              if (via) via.textContent = "local parser (bridge unavailable)";
              return mockValidate(schema, text);
            });
        } else {
          if (via) via.textContent = "local parser";
          promise = Promise.resolve(mockValidate(schema, text));
        }

        promise.then(function (result) {
          var ms = Math.max(1, Math.round(performance.now() - t0));
          if (result && result.ok) {
            status.setAttribute("data-state", "ok");
            label.textContent = "Valid";
            elapsed.textContent = "· parsed in " + ms + " ms";
            errsEl.setAttribute("data-count", "0");
            errsEl.innerHTML = "";
            updateGutter(ta);
          } else {
            var errs = (result && result.errors) || [];
            status.setAttribute("data-state", "err");
            label.textContent = errs.length + (errs.length === 1 ? " error" : " errors");
            elapsed.textContent = "· checked in " + ms + " ms";
            errsEl.setAttribute("data-count", String(errs.length));
            errsEl.innerHTML = "";
            errs.forEach(function (e) {
              errsEl.append(errorRow(e, ta));
            });
            updateGutter(
              ta,
              new Set(
                errs.map(function (e) {
                  return e.line;
                }),
              ),
            );
          }
        });
      }

      function errorRow(err, ta) {
        var row = h("button", {
          class: "cs-schema-err-row",
          type: "button",
          title: "Jump to this line",
          onclick: function () {
            jumpToLine(ta, err.line, err.col);
          },
        });
        row.innerHTML =
          '<span class="loc">line ' +
          err.line +
          (err.col ? ", col " + err.col : "") +
          "</span>" +
          '<span class="msg">' +
          (err.message || "") +
          "</span>" +
          '<span class="nav">' +
          icon("chevron-right") +
          "</span>";
        return row;
      }

      function jumpToLine(ta, line, col) {
        var lines = ta.value.split("\n");
        var pos = 0;
        for (var i = 0; i < line - 1 && i < lines.length; i++) {
          pos += lines[i].length + 1;
        }
        pos += Math.max(0, (col || 1) - 1);
        pos = Math.min(pos, ta.value.length);
        ta.focus();
        ta.setSelectionRange(pos, pos);
        var lineHeight = parseFloat(getComputedStyle(ta).lineHeight) || 20;
        ta.scrollTop = Math.max(0, (line - 3) * lineHeight);
        var g = $("cs-schema-v-gutter");
        if (g) g.scrollTop = ta.scrollTop;
      }

      /* ---------- Mock YAML/JSON validator ----------
       * Not a general YAML parser — just enough shape-checking for the shipped
       * examples: rejects unknown top-level keys, missing required keys, bad
       * enum values, pattern mismatches, and simple JSON syntax errors. */
      function mockValidate(schema, text) {
        var errors = [];
        if (schema.kind === "json") {
          try {
            JSON.parse(text);
            return { ok: true, errors: [] };
          } catch (e) {
            var m = /position (\d+)/.exec(String(e.message));
            var line = 1,
              col = 1;
            if (m) {
              var pos = parseInt(m[1], 10);
              var prefix = text.slice(0, pos);
              line = prefix.split("\n").length;
              col = pos - prefix.lastIndexOf("\n");
            }
            return {
              ok: false,
              errors: [
                {
                  line: line,
                  col: col,
                  message: "JSON parse error: " + String(e.message).replace(/^JSON\.parse: /, ""),
                },
              ],
            };
          }
        }

        var lines = text.split("\n");
        var topKeys = new Map();
        var i = 0;

        if (schema.kind === "frontmatter") {
          if (!/^---\s*$/.test((lines[0] || "").trim())) {
            errors.push({
              line: 1,
              col: 1,
              message: "frontmatter must start with <code>---</code>",
            });
          } else {
            i = 1;
          }
        }

        var allowedTopKeys = new Set(
          schema.fields
            .filter(function (f) {
              return f.name.indexOf(".") === -1;
            })
            .map(function (f) {
              return f.name;
            }),
        );
        var arrayAtTop = schema.slug === "teams-yml";

        var openedList = false;
        for (; i < lines.length; i++) {
          var raw = lines[i];
          var line = raw.replace(/\s+$/, "");
          if (/^---\s*$/.test(line.trim())) break;
          if (!line.trim() || /^\s*#/.test(line)) continue;

          if (arrayAtTop) {
            var listKV = line.match(/^-\s+([A-Za-z0-9_][\w-]*):\s*(.*)$/);
            if (listKV) {
              openedList = true;
              continue;
            }
            if (/^\s{2,}/.test(line) && openedList) continue;
            if (!openedList) {
              errors.push({
                line: i + 1,
                col: 1,
                message:
                  esc(schema.name) +
                  " should be an array of team objects (start with <code>- name:</code>)",
              });
            }
            continue;
          }

          var topM = line.match(/^([A-Za-z_][\w-]*)(:)(\s*)(.*)$/);
          if (topM) {
            var k = topM[1],
              rest = topM[4];
            if (!allowedTopKeys.has(k) && !hasNestedPrefix(schema, k)) {
              errors.push({
                line: i + 1,
                col: 1,
                message:
                  "unknown field <code>" +
                  esc(k) +
                  "</code> for <code>" +
                  esc(schema.name) +
                  "</code>",
              });
            } else {
              topKeys.set(k, { line: i + 1, raw: rest });
              var field = findField(schema, k);
              if (
                field &&
                field.allowed &&
                field.allowed.length &&
                rest &&
                !/^[\{\[]/.test(rest.trim())
              ) {
                var value = rest.trim().replace(/^["']|["']$/g, "");
                if (value && field.allowed.indexOf(value) === -1) {
                  var col = line.indexOf(rest) + 1 || 1;
                  errors.push({
                    line: i + 1,
                    col: col,
                    message:
                      esc(field.name) +
                      " must be one of: " +
                      field.allowed
                        .map(function (v) {
                          return "<code>" + esc(v) + "</code>";
                        })
                        .join(", ") +
                      " — got <code>" +
                      esc(value) +
                      "</code>",
                  });
                }
              }
              if (field && field.pattern && rest) {
                try {
                  var re = new RegExp("^" + field.pattern + "$");
                  var v2 = rest.trim().replace(/^["']|["']$/g, "");
                  if (v2 && !re.test(v2)) {
                    var col2 = line.indexOf(rest) + 1 || 1;
                    errors.push({
                      line: i + 1,
                      col: col2,
                      message:
                        esc(field.name) + " must match <code>" + esc(field.pattern) + "</code>",
                    });
                  }
                } catch (_) {
                  // Bad pattern on the schema side; skip.
                }
              }
            }
            continue;
          }
          if (/^\s+/.test(raw)) continue;
          if (line.trim() && !/^-/.test(line.trim())) {
            errors.push({ line: i + 1, col: 1, message: "could not parse this line" });
          }
        }

        if (!arrayAtTop) {
          schema.fields.forEach(function (f) {
            if (!f.required) return;
            if (f.name.indexOf(".") !== -1) return;
            if (!topKeys.has(f.name)) {
              errors.push({
                line: 1,
                col: 1,
                message: "missing required field <code>" + esc(f.name) + "</code>",
              });
            }
          });
        }

        errors.sort(function (a, b) {
          return a.line - b.line || (a.col || 1) - (b.col || 1);
        });
        return { ok: errors.length === 0, errors: errors };
      }

      function findField(schema, name) {
        for (var i = 0; i < schema.fields.length; i++) {
          if (schema.fields[i].name === name) return schema.fields[i];
        }
        return null;
      }

      function hasNestedPrefix(schema, k) {
        for (var i = 0; i < schema.fields.length; i++) {
          var n = schema.fields[i].name;
          if (n === k || n.indexOf(k + ".") === 0) return true;
        }
        return false;
      }

      /* ============================================================
       * Selection + deep-link
       * ============================================================ */
      function select(slug, opts) {
        opts = opts || {};
        var pushHash = opts.pushHash !== false;
        state.selected = slug;
        var rows = document.querySelectorAll(".cs-schema-row");
        for (var i = 0; i < rows.length; i++) {
          rows[i].setAttribute(
            "aria-selected",
            rows[i].getAttribute("data-slug") === slug ? "true" : "false",
          );
        }
        var sel = document.querySelector('.cs-schema-row[aria-selected="true"]');
        if (sel) sel.scrollIntoView({ block: "nearest" });
        renderDetail();
        if (pushHash) {
          var next = slug ? "#schema/" + slug : "";
          if (location.hash !== next) {
            history.replaceState(null, "", location.pathname + location.search + next);
          }
        }
        $("cs-schema-app").dataset.detailOpen = slug ? "true" : "false";
      }

      function fromHash() {
        var m = /^#schema\/(.+)$/.exec(location.hash);
        if (m) {
          for (var i = 0; i < SCHEMAS.length; i++) {
            if (SCHEMAS[i].slug === m[1]) {
              select(m[1], { pushHash: false });
              return;
            }
          }
        }
        if (!state.selected && SCHEMAS[0]) {
          select(SCHEMAS[0].slug, { pushHash: false });
        }
      }

      function openSource(ref) {
        var cs = window.codesense;
        if (cs && typeof cs.openSource === "function") {
          cs.openSource(ref);
        } else if (cs && typeof cs.invoke === "function") {
          // Best-effort: try the bridge openFile verb. Harmless if not allowlisted.
          try {
            cs.invoke("openFile", { ref: ref });
          } catch (_) {
            /* ignore */
          }
        } else {
          console.log("[schema-browser] openSource:", ref);
        }
      }

      /* ============================================================
       * Keyboard
       * ============================================================ */
      function visibleRows() {
        var all = document.querySelectorAll(".cs-schema-row");
        var out = [];
        for (var i = 0; i < all.length; i++) {
          if (all[i].offsetParent !== null) out.push(all[i]);
        }
        return out;
      }
      function moveSelection(delta) {
        var rows = visibleRows();
        if (!rows.length) return;
        var idx = -1;
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].getAttribute("aria-selected") === "true") {
            idx = i;
            break;
          }
        }
        var next = Math.max(0, Math.min(rows.length - 1, idx < 0 ? 0 : idx + delta));
        select(rows[next].getAttribute("data-slug"));
      }

      function setKind(k) {
        state.kind = k;
        var btns = document.querySelectorAll(".cs-schema-seg [data-kind]");
        for (var i = 0; i < btns.length; i++) {
          btns[i].setAttribute(
            "aria-pressed",
            btns[i].getAttribute("data-kind") === k ? "true" : "false",
          );
        }
        applyFilters();
        renderList();
      }

      /* ============================================================
       * Boot
       * ============================================================ */
      function boot() {
        $("cs-schema-q").addEventListener("input", function (e) {
          state.q = e.target.value;
          applyFilters();
          renderList();
        });
        var kindBtns = document.querySelectorAll(".cs-schema-seg [data-kind]");
        for (var i = 0; i < kindBtns.length; i++) {
          (function (btn) {
            btn.addEventListener("click", function () {
              setKind(btn.getAttribute("data-kind") || "");
            });
          })(kindBtns[i]);
        }

        document.addEventListener("keydown", function (e) {
          var active = document.activeElement;
          var inField = active && ["INPUT", "TEXTAREA", "SELECT"].indexOf(active.tagName) !== -1;
          if (e.key === "/" && !inField) {
            e.preventDefault();
            var q = $("cs-schema-q");
            q.focus();
            q.select();
            return;
          }
          if (e.key === "Escape") {
            if (active === $("cs-schema-q")) {
              state.q = "";
              $("cs-schema-q").value = "";
              applyFilters();
              renderList();
              return;
            }
            if ($("cs-schema-app").dataset.detailOpen === "true" && window.innerWidth <= 820) {
              $("cs-schema-app").dataset.detailOpen = "false";
              return;
            }
          }
          if (e.key === "ArrowDown" && !inField) {
            e.preventDefault();
            moveSelection(+1);
            return;
          }
          if (e.key === "ArrowUp" && !inField) {
            e.preventDefault();
            moveSelection(-1);
            return;
          }
          if (e.key === "Enter" && !inField) {
            e.preventDefault();
            scrollToValidator();
            return;
          }
        });

        window.addEventListener("hashchange", function () {
          fromHash();
        });

        applyFilters();
        loadSchemas();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    </script>
  </body>
</html>
