        pointer-events: none;
        height: 2px;
        background: var(--al-ring);
      }
      .al-drop-line::before,
      .al-drop-line::after {
        content: "";
        position: absolute;
        top: -3px;
        width: 2px;
        height: 8px;
        border-radius: 1px;
        background: var(--al-ring);
      }
      .al-drop-line::before {
        left: 0;
      }
      .al-drop-line::after {
        right: 0;
      }
      .al-ws-card {
        position: relative;
        margin: 2px 6px 0;
        border-radius: 6px;
        background: color-mix(in oklab, var(--al-fg) 5%, var(--al-bg));
      }
      .al-ws-head {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        height: 28px;
        padding: 0 8px 0 6px;
        font-size: 12px;
        border-radius: 6px;
      }
      .al-ws-head:hover {
        background: color-mix(in oklab, var(--al-fg) 8%, var(--al-bg));
      }
      .al-ws-name {
        flex: 0 1 auto;
        font-weight: 650;
        font-family: var(--cs-font-mono);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .al-ws-meta {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 0 1 auto;
        font-size: 10px;
        color: var(--al-muted);
      }
      /* Workspace tail: waiting and crashed counts, a state bar, the total. */
      .al-ws-tail {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: none;
        margin-left: auto;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--al-faint);
      }
      .al-ws-tail .al-hot {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-weight: 600;
        color: var(--al-fg);
      }
      .al-ws-tail .al-hot[data-needs] {
        color: var(--al-needs-text);
      }
      .al-bar {
        display: flex;
        gap: 1px;
        width: 34px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: var(--al-hover);
      }
      .al-bar > i {
        display: block;
      }
      .al-bar > [data-k="waiting"] {
        background: var(--al-needs);
      }
      .al-bar > [data-k="failed"] {
        background: var(--cs-state-failed);
      }
      .al-bar > [data-k="working"] {
        background: var(--al-busy);
      }
      .al-bar > [data-k="other"] {
        background: color-mix(in oklab, var(--al-idle) 45%, transparent);
      }
      /* Fold chevrons: the kit chevron, turned 90 degrees when open. */
      .al-fchev {
        flex: none;
        display: grid;
        place-items: center;
        width: 14px;
        color: var(--al-muted);
        transition: rotate 150ms ease-out;
      }
      .al-fchev svg.i {
        width: 12px;
        height: 12px;
      }
      [aria-expanded="true"] > .al-fchev {
        rotate: 90deg;
      }
      .al-ws-grip {
        position: absolute;
        left: 6px;
        top: 7px;
        display: grid;
        place-items: center;
        width: 14px;
        height: 14px;
        background: inherit;
        opacity: 0;
      }
      .al-ws-grip svg {
        width: 8px;
        height: 12px;
        fill: currentColor;
      }
      .al-ws-head:hover > .al-ws-grip,
      .al-ws-head:focus-visible > .al-ws-grip {
        opacity: 1;
      }
      @container (max-width: 259px) {
        .al-ws-meta {
          display: none;
        }
      }
      /* Another machine: always shown, with offline in the offline ink. */
      .al-ws-machine {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex: 0 1 auto;
        min-width: 0;
        font-size: 11px;
        font-weight: 500;
        color: var(--al-faint);
      }
      .al-ws-head:has(.al-ws-machine) .al-ws-name {
        flex-shrink: 0;
        max-width: 55%;
      }
      @container (max-width: 259px) {
        .al-ws-head:has(.al-ws-machine) .al-bar {
          display: none;
        }
      }
      .al-ws-machine > span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .al-ws-machine svg.i {
        width: 12px;
        height: 12px;
      }
      @container (max-width: 259px) {
        .al-ws-machine > span {
          display: none;
        }
      }
      /* Colour means state: offline stays neutral and reads by its wifi-off glyph and words. */
      .al-ws-machine[data-offline] {
        font-weight: 600;
      }
      /* Crew connectors (Soft guides): 1px rounded elbows from the parent's avatar centre.
         A trunk runs on while siblings follow and stops at the last child. */
      .al-tree {
        position: absolute;
        z-index: 1;
        pointer-events: none;
        border: 0 solid var(--al-tree);
      }
      .al-tree[data-k="pass"] {
        top: 0;
        bottom: 0;
        border-left-width: 1px;
      }
      .al-tree[data-k="elbow"] {
        top: 0;
        height: 14.5px;
        border-left-width: 1px;
        border-bottom-width: 1px;
        border-bottom-left-radius: var(--cs-radius-sm, 4px);
      }
      .al-tree[data-k="stem"] {
        top: 26px;
        bottom: 0;
        border-left-width: 1px;
      }
      .al-fold {
        position: absolute;
        top: 6px;
        width: 16px;
        height: 16px;
        z-index: 1;
        display: grid;
        place-items: center;
        color: var(--al-muted);
        background: none;
        border-radius: 3px;
      }
      .al-fold .al-fchev {
        width: 16px;
      }
      /* Deeper managers show their fold on hover or focus, or while folded, so it never sits on the lines. */
      .al-row[data-depth]:not([data-depth="0"]) > .al-fold:not([data-folded]) {
        opacity: 0;
        background: var(--al-hover);
      }
      .al-row[data-depth]:not([data-depth="0"]):hover > .al-fold,
      .al-row[data-depth]:not([data-depth="0"]):focus-within > .al-fold {
        opacity: 1;
      }
      .al-av .al-face {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--al-hover);
        font-weight: 600;
        font-size: 8.5px;
      }
      /* The state word sits at the row's right edge; the name gives way first. */
      .al-state {
        flex: none;
        margin-left: auto;
        padding-left: 8px;
        min-width: 56px;
        justify-content: flex-end;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: 11px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--al-faint);
      }
      .al-state[data-tone="working"] {
        color: color-mix(in oklab, var(--al-busy) 85%, var(--al-fg));
      }
      .al-state[data-tone="needs"] {
        color: var(--al-needs-text);
        font-weight: 600;
      }
      .al-state[data-tone="failed"] {
        color: var(--cs-state-failed);
        font-weight: 600;
      }
      .al-state[data-tone="offline"] {
        color: var(--al-faint);
      }
      .al-row[data-manager-view] .al-state .al-subs {
        display: none;
      }
      .al-state .al-subs {
        margin-left: 3px;
        color: inherit;
        font-weight: 600;
      }
      /* Workspace view keeps one line; role, model and time are in the row's tooltip. */
      .al-row[data-agent-id]:not([data-manager-view]) .al-l2 {
        display: none;
      }
      .al-ask,
      .al-chosen {
        display: block;
        min-width: 0;
        height: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .al-lines {
        overflow: hidden;
      }
      .al-folded {
        white-space: nowrap;
      }
      .al-item > .al-section {
        height: 26px;
        margin: 0;
      }
      .al-stage-rail {
        --cs-rail-fill: var(--al-fg);
        --cs-rail-empty: var(--al-muted);
        --cs-rail-done: var(--al-fg);
        --cs-rail-wall: var(--al-fg);
        display: inline-flex;
        flex: none;
      }
      .al-ws-meta {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mark[data-mark="error"],
      .mark[data-mark="crashed"] {
        color: var(--cs-state-failed);
      }
      .cs-mark-spin {
        animation: al-spin 1.1s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .cs-mark-spin {
          animation: none;
        }
      }

      .al-scope {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 8px 6px;
        font-size: 11px;
        color: var(--al-muted);
        flex: none;
      }
      .al-scope select {
        appearance: none;
        flex: 1;
        min-width: 0;
        padding: 3px 22px 3px 3px;
        border-radius: 3px;
        border: 0;
        color: var(--al-fg);
        background: var(--al-bg);
        font-size: 11px;
      }
      #al-scope-chevron {
        position: absolute;
        right: 4px;
        pointer-events: none;
        color: var(--al-fg);
      }
      .al-scope select:focus-visible {
        outline: 1px solid var(--al-fg);
        outline-offset: 2px;
      }
      /* The find field's wrapper (native "shrink-0 px-1.5 pb-2") and the field (.ag-find). */
      .al-findwrap {
        flex: none;
        padding: 0 6px 8px;
      }
      .al-find {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 3px 4px 3px 9px;
        border-radius: 7px;
        color: var(--al-faint);
        background: color-mix(in oklab, var(--al-fg) 4%, var(--al-bg));
        box-shadow: inset 0 0 0 1px var(--al-line);
        transition: box-shadow 120ms ease;
      }
      .al-find:has(> input:focus) {
        box-shadow:
          inset 0 0 0 1px color-mix(in oklab, var(--al-ring) 70%, transparent),
          0 0 0 3px color-mix(in oklab, var(--al-ring) 18%, transparent);
      }
      .al-find > input {
        flex: 1 1 60px;
        min-width: 60px;
        height: 22px;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 12px;
        color: var(--al-fg);
        caret-color: var(--al-fg);
      }
      .al-find > input::placeholder {
        color: var(--al-faint);
      }
      .al-find > input::-webkit-search-cancel-button {
        display: none;
      }
      /* .ag-chips / .ag-chip: one line of chips, at most 62% of the field; each chip truncates. */
      .al-chips {
        display: flex;
        flex: 0 1 auto;
        flex-wrap: nowrap;
        gap: 4px;
        min-width: 0;
        max-width: 62%;
        overflow: hidden;
      }
      .al-chip {
        display: inline-flex;
        flex: 0 1 auto;
        min-width: 0;
        max-width: 100%;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
        color: var(--al-muted);
        background: color-mix(in oklab, var(--al-fg) 9%, transparent);
        white-space: nowrap;
      }
      .al-chip > span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .al-chip > button {
        display: grid;
        place-items: center;
        border-radius: 999px;
        opacity: 0.7;
      }
      .al-chip > button:hover {
        opacity: 1;
      }
      .al-clear,
      .al-filter {
        display: grid;
        place-items: center;
        flex: none;
        border-radius: 5px;
        color: var(--al-faint);
      }
      .al-clear {
        width: 18px;
        height: 18px;
      }
      .al-filter {
        width: 22px;
        height: 22px;
      }
      .al-clear:hover,
      .al-filter:hover,
      .al-filter[aria-expanded="true"] {
        color: var(--al-fg);
        background: var(--al-hover);
      }
      /* Filter and arrange (.ag-fpop and .ag-fm-*). */
      .al-fpop {
        position: fixed;
        z-index: 30;
        width: 232px;
        max-height: min(420px, calc(100dvh - 12px));
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 4px 6px 6px;
        border-radius: 9px;
        color: var(--al-fg);
        background: var(--al-bg);
        box-shadow: var(--cs-shadow);
      }
      .al-fsec {
        padding: 10px 6px 4px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--al-faint);
      }
      .al-fsec:first-child {
        padding-top: 6px;
      }
      .al-fsec:not(:first-child) {
        margin: 6px 2px 0;
        padding: 10px 4px 4px;
        border-top: 1px solid var(--al-line);
      }
      .al-forg {
        padding: 2px 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--al-muted);
      }
      .al-fitem {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 4px 6px;
        border-radius: 6px;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      .al-fitem:hover {
        background: var(--al-hover);
      }
      .al-fitem > :first-child {
        flex: none;
        width: 14px;
        min-width: 14px;
        display: grid;
        place-items: center;
      }
      .al-fitem > span:nth-child(2) {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .al-fitem input {
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: var(--cs-accent);
      }
      .al-fitem:has(input:disabled) {
        cursor: default;
      }
      .al-fitem input:disabled {
        opacity: 0.55;
      }
      .al-fitem[aria-checked="true"] {
        font-weight: 600;
        background: color-mix(in oklab, var(--al-fg) 9%, transparent);
      }
      .al-fitem .mark .spin,
      .al-fitem .mark .think,
      .al-fitem .mark .halo {
        animation: none;
      } /* a menu's marks hold still */
      .al-fn {
        margin-left: auto;
        font-size: 11px;
        color: var(--al-muted);
        font-variant-numeric: tabular-nums;
      }
      .al-seg {
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: 7px;
        background: color-mix(in oklab, var(--al-fg) 6%, transparent);
      }
      .al-seg button {
        flex: 1 1 0;
        height: 24px;
        border-radius: 5px;
        font-size: 11.5px;
        color: var(--al-muted);
        text-align: center;
      }
      .al-seg button:hover:not([aria-checked="true"]) {
        color: var(--al-fg);
      }
      .al-seg button[aria-checked="true"] {
        font-weight: 600;
        color: var(--al-fg);
        background: color-mix(in oklab, var(--al-fg) 13%, var(--al-bg));
        box-shadow: var(--cs-shadow);
      }
      /* The team funnel (.ag-team-funnel): on hover or focus while more than one team shows; pressed, it stays and takes the accent. */
      .al-team-funnel {
        z-index: 4;
        transition:
          opacity 120ms ease,
          color 120ms ease,
          background-color 120ms ease;
      }
      .al-team-funnel[aria-pressed="true"] {
        opacity: 1;
        color: var(--cs-accent);
      }
      /* The Pinned group (.ag-group + .ag-group-label): a quiet label over its rows. */
      /* Row markers (RowMarkerView): "due" is the .ag-count pill; hidden tab, headless and pin are 12px faint glyphs. */
      .al-marker {
        margin-left: 4px;
        color: var(--al-faint);
      }
      .al-marker svg.i {
        width: 12px;
        height: 12px;
      }
      .al-marker[data-kind="due"] {
        gap: 2px;
        height: 15px;
        padding: 0 5px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        color: var(--al-muted);
        background: color-mix(in oklab, var(--al-fg) 9%, transparent);
      }
      .al-marker[data-kind="due"] svg.i {
        width: 10px;
        height: 10px;
      }
      /* Role chips: up to two, then "+N", below Manager rows. Compact rows expose roles in
         the tooltip and accessible label. */
      .al-holds {
        flex: none;
        align-self: flex-start;
        display: inline-flex;
        gap: 4px;
        align-items: center;
        max-width: 65%;
        margin: 24px 8px 0 0;
        overflow: hidden;
        white-space: nowrap;
        font-size: 11px;
        color: var(--al-muted);
      }
      .al-row[data-manager-view] .al-holds {
        margin: 0 8px 6px calc(var(--indent, 18px) + 35px);
      }
      .al-role {
        gap: 4px;
        height: auto;
        padding: 1px 5px 1px 2px;
        border-radius: 9px;
        font-size: 11px;
        color: var(--al-fg);
        background: color-mix(in oklab, var(--al-role-hue) 12%, transparent);
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--al-role-hue) 30%, transparent);
      }
      .al {
        --al-role-hue: var(--al-fg);
      }
      /* Empty and wait states, at native metrics ("px-[15px] py-3", 12px/500 title, 11px/15px faint sentence). */
      .al-empty {
        display: grid;
        justify-items: center;
        padding: 32px 18px;
        text-align: center;
      }
      .al-empty-icon {
        display: grid;
        margin-bottom: 8px;
        color: var(--al-muted);
      }
      .al-empty-icon svg.i {
        width: 20px;
        height: 20px;
      }
      .al-empty b {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--al-fg);
      }
      .al-empty p {
        max-width: 26ch;
        margin: 4px 0 0;
        font-size: 11.5px;
        line-height: 16px;
        color: var(--al-faint);
      }
      .al-empty .al-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        column-gap: 12px;
        margin-top: 8px;
      }
      /* .ag-link: text ink, underline in the line colour until hover. */
      .al-link {
        align-self: auto;
        margin: 0;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--al-fg);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--al-line);
      }
      .al-link:hover {
        text-decoration-color: currentColor;
      }
      .al-item > .al-link {
        display: block;
        padding: 4px 15px;
      }
      /* A row that arrives after the 800ms settle eases in (.ag-enter). */
      .al-enter {
        animation: al-enter 280ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes al-enter {
        from {
          opacity: 0;
          transform: translateY(-4px);
          filter: blur(2px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .al-enter {
          animation: none;
        }
      }

      .al-head {
        height: auto;
      }
      .al-head .grow {
        flex: 1;
      }
      /* The arrangement as one compact select beside the title (writes ui:dock arrange). */
      .al-view {
        position: relative;
        display: inline-flex;
        align-items: center;
        flex: 0 1 auto;
        min-width: 0;
        margin-left: 4px;
      }
      .al-view select {
        appearance: none;
        min-width: 0;
        height: 22px;
        padding: 0 18px 0 7px;
        border: 0;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 500;
        color: var(--al-fg);
        background: var(--al-hover);
        cursor: pointer;
        text-overflow: ellipsis;
      }
      .al-view select:hover {
        background: var(--al-current);
      }
      #al-arrange-chevron {
        position: absolute;
        right: 4px;
        display: grid;
        pointer-events: none;
        color: var(--al-faint);
      }
      #al-arrange-chevron svg.i {
        width: 12px;
        height: 12px;
      }
      /* Tally under the find field: each count is a Show filter (search.status in ui:dock). */
      .al-tally {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        margin-top: 6px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .al-tally:empty {
        display: none;
      }
      .al-tally > * {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 6px 0 4px;
        border-radius: 5px;
        color: var(--al-faint);
        white-space: nowrap;
      }
      .al-tally button:hover {
        color: var(--al-fg);
        background: var(--al-hover);
      }
      .al-tally button[aria-pressed="true"] {
        color: var(--al-fg);
        font-weight: 600;
        background: var(--al-current);
      }
      .al-tally .al-waiting {
        color: var(--al-fg);
        font-weight: 600;
        background: color-mix(in oklab, var(--al-needs) 14%, var(--al-bg));
      }
      .al-tally .al-waiting[aria-pressed="true"] {
        background: color-mix(in oklab, var(--al-needs) 24%, var(--al-bg));
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--al-needs) 50%, transparent);
      }
      .al-icon {
        display: inline-grid;
        place-items: center;
        height: 24px;
        min-width: 24px;
        border-radius: 6px;
        color: var(--al-faint);
      }
      .al-icon:hover,
      .al-icon[aria-pressed="true"] {
        color: var(--al-fg);

    <script id="al-card-math">
      window.agentListCardMath = (() => {
        const CARD_MOVE_REFUSED = {
          filtered: "Cards can't move while a search or filter is on. Clear them to move it.",
          byStatus: "Cards move in the By team arrangement. Switch to it to move this one.",
          noPill: "This card has no pill in the tray, so it has no place in the order to move.",
          nowhere: "This card has no other card in its team to move past.",
        };
        function boxes(rows) {
          let end = 0;
          return rows.map((row) => ({ start: end, end: (end += row.height) }));
        }
        function teamIndexes(rows, team) {
          const at = rows.findIndex((r) => r.kind === "team" && r.team === team),
            indexes = [];
          if (at < 0) return indexes;
          for (let i = at + 1; i < rows.length && rows[i].kind !== "team"; i++)
            if (rows[i].kind === "workspace" && rows[i].workspace) indexes.push(i);
          return indexes;
        }
        function teamSlotCards(rows, team, order) {
          return teamIndexes(rows, team).map((i) => ({
            id: rows[i].workspace,
            pill: order.includes(rows[i].workspace),
          }));
        }
        function placeForSlot(cards, id, slot) {
          const from = cards.findIndex((c) => c.id === id);
          if (!cards[from]?.pill) return null;
          const lo = slot <= from ? slot : from + 1,
            hi = slot <= from ? from : slot;
          if (!cards.slice(lo, hi).some((c) => c.pill)) return null;
          for (let i = slot - 1; i >= 0; i--)
            if (cards[i].id !== id && cards[i].pill) return { after: cards[i].id };
          for (let i = slot; i < cards.length; i++)
            if (cards[i].id !== id && cards[i].pill) return { before: cards[i].id };
          return null;
        }
        function stepSlot(cards, id, direction) {
          const from = cards.findIndex((c) => c.id === id),
            step = direction === "up" ? -1 : 1;
          if (!cards[from]?.pill) return null;
          for (let i = from + step; i >= 0 && i < cards.length; i += step) {
            if (cards[i].pill)
              return direction === "up"
                ? { slot: i, place: { before: cards[i].id } }
                : { slot: i + 1, place: { after: cards[i].id } };
          }
          return null;
        }
        function cardDropTarget(rows, boxes, team, id, y, order, pane) {
          const none = { slot: null, place: null, lineY: null };
          const at = rows.findIndex((r) => r.kind === "team" && r.team === team);
          if (at < 0) return none;
          let last = at;
          while (last + 1 < rows.length && rows[last + 1].kind !== "team") last++;
          const top = Math.max(boxes[at].start - 8, boxes[at - 1]?.end ?? -Infinity),
            bottom = Math.min(boxes[last].end + 24, boxes[last + 1]?.start ?? Infinity);
          if (
            y < top ||
            y > bottom ||
            (pane && (pane.x < pane.left - 48 || pane.x > pane.right + 48))
          )
            return none;
          const blocks = teamIndexes(rows, team).map((i) => {
            let last = i;
            while (last + 1 < rows.length && !["workspace", "team"].includes(rows[last + 1].kind))
              last++;
            return {
              id: rows[i].workspace,
              start: boxes[i].start,
              end: boxes[last].end,
              next: boxes[last + 1]?.start,
            };
          });
          if (!blocks.length) return none;
          const slot = blocks.filter((b) => (b.start + b.end) / 2 < y).length,
            place = placeForSlot(teamSlotCards(rows, team, order), id, slot),
            tail = blocks[blocks.length - 1];
          return {
            slot,
            place,
            lineY: !place
              ? null
              : slot < blocks.length
                ? blocks[slot].start + 4
                : Math.min(tail.end + 4, tail.next ?? Infinity),
          };
        }
        return { CARD_MOVE_REFUSED, boxes, teamSlotCards, stepSlot, cardDropTarget };
      })();
    </script>
    <script>
      "use strict";
      const cs = window.codesense,
        kit = cs.kit,
        box = document.getElementById("list");
      // Geometry from src/features/viewer/components/agents-tree-view.tsx.
      const TREE_INDENT_PX = 18,
        MAX_INDENT_LEVELS = 4;
      const WORDS = {
        running: "Working",
        thinking: "Thinking",
        "tool-running": "Running a tool",
        paused: "Needs you",
        blocked: "Blocked",
        "awaiting-answer": "Needs you",
        idle: "Ready",
        stalled: "Stalled",
        unknown: "",
        completed: "Ended",
        dropped: "Needs you",
        failed: "Error",
        crashed: "Crashed",
        done: "Ended",
        errored: "Error",
      };
      const WAITING = "Waiting on you";
      // Needs you: the engine's set (signal_progress "blocked" means stopped to wait on the human).
      // Crashed is its own state and count, never needs-you.
      const NEEDS = new Set([
          "awaiting-answer",
          "paused",
          "blocked",
          "dropped",
          "failed",
          "errored",
        ]),
        WORKING = new Set(["running", "thinking", "tool-running"]),
        STOPPED = new Set(["done", "completed", "crashed"]),
        CRASHED = new Set(["crashed"]);
      let references = [],
        metadata = {},
        sessions = new Map(),
        inbox = new Map(),
        ui = {},
        flat = [];
      let temporary = new Set(),
        pendingReveal = null,
        scheduled = 0,
        visible = true,
        currentWorkspace = null;
      function h(tag, attrs, ...children) {
        const el = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs || {})) {
          if (value === undefined || value === null || value === false) continue;
          if (key === "class") el.className = value;
          else if (key === "text") el.textContent = value;
          else if (key.startsWith("on")) el.addEventListener(key.slice(2).toLowerCase(), value);
          else el.setAttribute(key, value === true ? "" : String(value));
        }
        for (const child of children.flat())
          if (child !== null && child !== undefined && child !== false) el.append(child);
        return el;
      }
      function icon(name) {
        const el = kit.icon(name, { size: 12 });
        el.classList.add("i");
        el.setAttribute("aria-hidden", "true");
        return el;
      }
      // Pixel geometry from src/shared/lib/status-mark-svg.ts.
      function statusMarkDrawing(mark, s, maskId) {
        const c = s / 2;
        const w = s <= 8 ? 1.5 : Math.round(s * 0.17 * 4) / 4;
        const r = c - w / 2;
        const ring = `fill="none" stroke="currentColor" stroke-width="${w}"`;
        const circle = `<circle cx="${c}" cy="${c}" r="${r}" ${ring}/>`;
        const halo = (still = false) =>
          `<circle class="cs-mark-halo${still ? "-still" : ""}" cx="${c}" cy="${c}" r="${c + 1.25}" fill="none" stroke="currentColor" stroke-width="1.5"${still ? ' opacity="0.35"' : ""}/>`;
        const cut = (shape, body = `<circle cx="${c}" cy="${c}" r="${c}" fill="currentColor"`) =>
          `<mask id="${maskId}"><rect width="${s}" height="${s}" fill="white"/>${shape}</mask>${body} mask="url(#${maskId})"/>`;
        switch (mark) {
          case "ready":
            return { html: circle };
          case "tool":
            return {
              className: "cs-mark-spin",
              html: `<path d="M ${c} ${c - r} A ${r} ${r} 0 1 1 ${c - r} ${c}" ${ring} stroke-linecap="round"/>`,
            };
          case "thinking": {
            const dr = Math.max(0.65, s * 0.11),
              gap = Math.max(1.65, s * 0.3);
            return {
              html: [c - gap, c, c + gap]
                .map(
                  (x, i) =>
                    `<circle class="cs-mark-think" data-i="${i}" cx="${x}" cy="${c}" r="${dr}" fill="currentColor"/>`,
                )
                .join(""),
            };
          }
          case "question":
            return {
              html:
                halo() +
                cut(
                  `<text x="${c}" y="${c + s * 0.14}" font-size="${s * 0.75}" font-family="ui-sans-serif, system-ui" font-weight="700" text-anchor="middle" data-mask fill="black">?</text>`,
                ),
            };
          case "permission": {
            const bw = Math.max(1, Math.round(s * 0.5)),
              bh = Math.max(1, Math.round(s * 0.18));
            return {
              html:
                halo() +
                cut(
                  `<rect x="${c - bw / 2}" y="${c - bh / 2}" width="${bw}" height="${bh}" rx="${bh * 0.3}" data-mask fill="black"/>`,
                ),
            };
          }
          case "blocked": {
            const bw = Math.max(0.9, Math.round(s * 0.14 * 2) / 2),
              bh = s * 0.5,
              gap = Math.max(1, s * 0.1);
            return {
              html:
                halo(true) +
                cut(
                  `<rect x="${c - gap / 2 - bw}" y="${c - bh / 2}" width="${bw}" height="${bh}" data-mask fill="black"/><rect x="${c + gap / 2}" y="${c - bh / 2}" width="${bw}" height="${bh}" data-mask fill="black"/>`,
                ),
            };
          }
          case "error": {
            const bw = Math.max(1, Math.round(s * 0.15 * 2) / 2);
            return {
              html: cut(
                `<rect x="${c - bw / 2}" y="${s * 0.36}" width="${bw}" height="${s * 0.28}" data-mask fill="black"/><rect x="${c - bw / 2}" y="${s * 0.7}" width="${bw}" height="${bw}" data-mask fill="black"/>`,
                `<path d="M ${c} ${s * 0.04} L ${s} ${s * 0.92} L 0 ${s * 0.92} Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" stroke-linejoin="round"`,
              ),
            };
          }
          case "ended": {
            const sw = s <= 8 ? 1.25 : w * 0.85,
              inset = s * 0.1 + sw / 2;
            return {
              html: `<rect x="${inset}" y="${inset}" width="${s - 2 * inset}" height="${s - 2 * inset}" rx="${Math.max(0.5, s * 0.08)}" fill="none" stroke="currentColor" stroke-width="${sw}"/>`,
            };
          }
          case "crashed": {
            const inset = s * 0.1;
            return {
              html: `<rect x="${inset}" y="${inset}" width="${s - 2 * inset}" height="${s - 2 * inset}" rx="${Math.max(0.75, s * 0.1)}" fill="currentColor"/>`,
            };
          }
          case "unknown": {
            const seg = (2 * Math.PI * r) / 6;
            return {
              html: `<circle cx="${c}" cy="${c}" r="${r}" ${ring} stroke-dasharray="${seg * 0.55} ${seg * 0.45}"/>`,
            };
          }
          case "stalled":
            return {
              html:
                circle +
                `<circle cx="${c}" cy="${c}" r="${Math.max(0.9, s * 0.15)}" fill="currentColor"/>`,
            };
          case "offline":
            return {
              html:
                circle +
                `<line fill="none" x1="${s * 0.15}" y1="${s * 0.85}" x2="${s * 0.85}" y2="${s * 0.15}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/>`,
            };
        }
      }

      let markId = 0;
      function mark(kind, size = 8) {
        const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"),
          drawing = statusMarkDrawing(kind, size, "agent-mark-" + markId++);
        s.setAttribute("width", size);
        s.setAttribute("height", size);
        s.setAttribute("viewBox", `0 0 ${size} ${size}`);
        s.setAttribute("aria-hidden", "true");
        s.setAttribute("class", "mark " + (drawing.className || ""));
        s.dataset.mark = kind;
        s.dataset.tone = ["question", "permission", "blocked"].includes(kind)
          ? "needs"
          : ["tool", "thinking"].includes(kind)
            ? "busy"
            : ["error", "crashed"].includes(kind)
              ? "failed"
              : "idle";
        s.innerHTML = drawing.html;
        return s;
      }
      // Fold key shapes from src/shared/lib/workspace-key.ts.
      const teamKey = (t) => "#team-fold:" + t,
        workspaceKey = (t, w) => "#ws-fold:" + t + (w ? "|" + w : "#no-workspace"),
        managerKey = (t, h) => "#manager-fold:" + t + "|" + h;
      const folded = (k) => !freezesFolds && ui.folds?.[k] === true && !temporary.has(k),
        nameOf = (s) => s?.rowNames?.primary || s?.displayName || s?.handle || "Agent",
        // The one needs-you predicate: every count, filter, command and row treatment uses it.
        isNeedsYou = (s) =>
          !!s &&
          s.state !== "offline" &&
          (NEEDS.has(s.effectiveStatus) ||
            (!!s.pendingAsk && s.state !== "offline" && !STOPPED.has(s.effectiveStatus)));
      function elapsed(s) {
        if (STOPPED.has(s.effectiveStatus)) return WORDS[s.effectiveStatus];
        if (s.startedAtMs == null) return "";
        const seconds = Math.floor((Date.now() - s.startedAtMs) / 1000);
        if (seconds < 0) return "";
        if (seconds < 60) return seconds + "s";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + "m";
        return Math.floor(minutes / 60) + "h" + (minutes % 60 ? " " + (minutes % 60) + "m" : "");
      }
      function stalledAge(s) {
        return s?.activityAtMs == null
          ? "Stalled"
          : `Last activity ${Math.floor(Math.max(0, Date.now() - s.activityAtMs) / 60000)}m ago`;
      }
      function viaGlyph() {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 12 12");
        svg.setAttribute("class", "i");
        svg.setAttribute("aria-hidden", "true");
        svg.innerHTML =
          '<path d="M3 3v3.25A1.75 1.75 0 0 0 4.75 8H10 M8 5.5 10.5 8 8 10.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>';
        return svg;
      }
      function lines(s) {
        const p = s.progress,
          status = s.effectiveStatus;
        // Every needs-you row says so, with what it waits on when known.
        const detail =
          status === "paused"
            ? oneLine(s.pendingAsk) || "approval"
            : status === "blocked" || status === "failed" || status === "errored"
              ? oneLine(p?.note) || oneLine(s.pendingAsk)
              : oneLine(s.pendingAsk);
        const ask = isNeedsYou(s) ? WAITING + (detail ? " · " + detail : "") : null;
        const activity =
          status === "stalled"
            ? "Stalled"
            : ask || p?.phase === "blocked"
              ? null
              : p?.note?.trim() && s.rowNames?.source !== "progress"
                ? p.note.trim()
                : p?.total > 0 && typeof p.step === "number"
                  ? `${p.step} of ${p.total} · ${p.phase}`
                  : null;
        return { ask, activity };
      }
      // Unwrap code before removing presentation marks; identifiers and code stay literal.
      function oneLine(text) {
        return String(text || "")
          .split(/(```[\s\S]*?```|`[^`\n]+`)/g)
          .map((part, i) => {
            if (i % 2)
              return part.startsWith("```")
                ? part.slice(3, -3).replace(/^[^\n]*\n/, "")
                : part.slice(1, -1);
            return part
              .replace(/^[ \t]*(?:[-*+]|\d+[.)]|#{1,6})\s+/gm, "")
              .replace(/(^|[^\w])(\*{1,3}|_{1,3}|~~)(?=\S)(.+?\S|\S)\2(?=$|[^\w])/g, "$1$3");
          })
          .join("")
          .replace(/\s+/g, " ")
          .trim();
      }
      function rowInset(row) {
        return row.pinnedCopy
          ? 6
          : 6 +
              (row.manager ? 16 : row.inWorkspace ? 12 : 0) +
              Math.min(row.depth || 0, MAX_INDENT_LEVELS) * TREE_INDENT_PX;
      }
      function agentHeight(row) {
        const { s, text } = row;
        // 4px padding + 20px title (+ 16px detail in Manager view) + 4px padding.
        let height =
          (row.manager && !row.pinnedCopy ? 44 : 28) +
          (!row.pinnedCopy && row.ref?.parentSource === "chosen" ? 15 : 0) +
          (row.scopeContext ? 15 : 0) +
          (row.manager && !row.pinnedCopy && s.roleHoldings?.length ? 24 : 0) +
          (row.manager && !row.pinnedCopy && subagentsWorking(s) ? 16 : 0);
        // The ask is one 15px line under the title (+2px gap), so heights never depend on text.

          !event.metaKey &&
          !event.ctrlKey &&
          !event.shiftKey &&
          ["ArrowUp", "ArrowDown"].includes(event.key) &&
          event.target.closest(".al-ws-head")
        ) {
          const id = event.target.closest("[data-row-id]").dataset.rowId,
            row = flat.find((r) => r.id === id);
          if (row?.workspace) {
            event.preventDefault();
            const refused = cardRefusal(row),
              step =
                !refused &&
                cardMath.stepSlot(
                  cardMath.teamSlotCards(flat, row.team, workspaceOrder(row.team)),
                  row.workspace,
                  event.key === "ArrowUp" ? "up" : "down",
                );
            if (refused || !step) announceMove(refused || CARD_MOVE_REFUSED.nowhere);
            else if (!event.repeat) void moveCard(row, step.place, true);
          }
          return;
        }
        if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
        const item = event.target.closest("[data-row-id]"),
          at = flat.findIndex((r) => r.id === item?.dataset.rowId);
        if (at < 0) return;
        const row = flat[at];
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          if (row.foldKey) {
            event.preventDefault();
            if (!event.repeat) fold(row.foldKey, event.key === "ArrowLeft");
          }
          return;
        }
        if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
        event.preventDefault();
        if (event.repeat) return;
        const step = event.key === "ArrowDown" ? 1 : -1;
        let next = at + step;
        while (next >= 0 && next < flat.length && flat[next].kind !== "agent") next += step;
        if (next >= 0 && next < flat.length) revealIndex(next, true);
      });
      function agentReference(id) {
        return references.find((r) => {
          const s = sessions.get(r.sessionRef);
          return s && (s.id === id || s.sessionId === id);
        });
      }
      function focusAgent(id) {
        const ref = agentReference(id);
        if (!ref) return;
        unfoldTo(ref.sessionRef);
        revealIndex(
          flat.findIndex((r) => r.id === ref.id),
          true,
        );
      }
      function allFoldKeys() {
        return [
          ...new Set([
            ...flatten(true)
              .map((r) => r.foldKey)
              .filter(Boolean),
            ...Object.keys(ui.folds || {}),
          ]),
        ];
      }
      function stepNeedsYou(step) {
        const agents = flatten(true).filter((r) => r.kind === "agent"),
          focused = document.activeElement?.closest("[data-row-id]")?.dataset.rowId,
          at = agents.findIndex((r) => r.id === focused);
        for (let offset = 1; offset <= agents.length; offset++) {
          const index = (at < 0 ? (step > 0 ? -1 : 0) : at) + step * offset,
            row = agents[(index + agents.length) % agents.length];
          if (isNeedsYou(row.s)) {
            focusAgent(row.ref.sessionRef);
            return;
          }
        }
      }
      const commands = {
        "focus-search": () => {
          showRuns = false;
          runRequest++;
          paint();
          $("al-search").focus({ preventScroll: true });
        },
        "switch-arrangement": () => changeArrange(ui.arrange === "teams" ? "manager" : "teams"),
        "focus-list": () => {
          const ref =
            agentReference(ui.selected) || flatten(true).find((r) => r.kind === "agent")?.ref;
          if (ref) focusAgent(ref.sessionRef);
          else box.focus();
        },
        "reveal-current": () => focusAgent(ui.selected),
        "collapse-all": () => fold(Object.fromEntries(allFoldKeys().map((key) => [key, true]))),
        "expand-all": () => fold(Object.fromEntries(allFoldKeys().map((key) => [key, false]))),
        "next-needs-you": () => stepNeedsYou(1),
        "previous-needs-you": () => stepNeedsYou(-1),
        "open-row-menu": () => {
          const row = document.activeElement?.closest("[data-codesense-row]");
          const target = row && (row.querySelector(".al-main") || document.activeElement);
          target?.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
        },
      };
      const pendingCommands = [];
      cs.onCommand?.((command) => {
        pendingCommands.push(command.id);
        ready
          .then(() => {
            for (const id of pendingCommands.splice(0)) {
              if (
                !["focus-search", "switch-arrangement"].includes(id) &&
                document.activeElement?.closest("input, textarea, select, [contenteditable='true']")
              )
                continue;
              commands[id]?.();
            }
          })
          .catch(report);
      });
      cs.onIntent?.((intent) => {
        if (intent?.kind !== "reveal-workspace") return;
        showRuns = false;
        runRequest++;
        if (ui.arrange === "manager") {
          paint();
          return;
        }
        temporary.clear();
        temporary.add(teamKey(intent.teamKey));
        temporary.add(workspaceKey(intent.teamKey, intent.workspaceId));
        pendingReveal = "workspace:" + intent.teamKey + "|" + intent.workspaceId;
        paint();
      });
      cs.onFocusIn?.(() => {
        if (showRuns) {
          if (!$("al-runs").contains(document.activeElement))
            $("al-runs").querySelector("input, button")?.focus({ preventScroll: true });
          return;
        }
        if (
          document.activeElement?.closest(
            "#al-find, #al-tally, #al-arrange-wrap, #al-scope-wrap, #al-history, #al-launch",
          )
        )
          return;
        if (box.contains(document.activeElement) && document.activeElement !== box) return;
        const current =
          box.querySelector('.al-main[aria-current="true"]') ||
          box.querySelector(".al-main") ||
          box.querySelector(".al-team-head");
        (current || box).focus({ preventScroll: true });
      });
      cs.onFocusReturn?.((event) => {
        const anchor = document.getElementById(event.anchorId);
        const control = anchor?.matches("button, [tabindex]")
          ? anchor
          : anchor?.querySelector(".al-main, .al-ws-head");
        if (control) control.focus({ preventScroll: true });
        else {
          const first = [...document.querySelectorAll("button, input, select, [tabindex]")].find(
            (el) =>
              el.tabIndex >= 0 &&
              !el.disabled &&
              el.getClientRects().length &&
              getComputedStyle(el).visibility === "visible",
          );
          first?.focus({ preventScroll: true });
        }
      });
      cs.onFlush?.(() => {});
      cs.onVisibility((shown) => {
        visible = shown;
        if (!shown) closeMenus();
        if (shown) {
          list?.refresh();
          schedule();
          if (showRuns) void loadRuns();
        }
      });
      const runClock = setInterval(() => {
        if (visible && showRuns)
          $("al-runs")
            .querySelectorAll("[data-run-ended]")
            .forEach((el) => {
              el.textContent = ago(el.dataset.runEnded);
            });
      }, 30000);
      cs.onTeardown?.(() => {
        endCardDrag(false, false);
        clearCardFocus();
        document.removeEventListener("focusout", cardFocusOut);
        window.removeEventListener("blur", clearCardFocus);
        window.removeEventListener("blur", closeMenus);
        window.removeEventListener("resize", viewportChanged);
        document.removeEventListener("visibilitychange", menuHidden);
        document.removeEventListener("keydown", menuEscape);
        clearTimeout(announcementTimer);
        clearInterval(runClock);
        runListRequest++;
        clearTimeout(historyTimer);
        runRequest++;
        if (scheduled) cancelAnimationFrame(scheduled);
        if (agentView) cs.unsubscribe?.("agentList", agentView.changed, agentView.options);
        list?.destroy();
      });
      if (cs.firstPaint?.topic === "agentList") {
        referenceOrder = "plain";
        receive("agentList", cs.firstPaint);
      }
      function viewportChanged() {
        if (menuOpen) positionMenu($("al-menu"));
        schedule();
      }
      window.addEventListener("resize", viewportChanged);
      const ready = Promise.all(
        ["sessions", "inbox", "ui:dock"].map((topic) =>
          cs.subscribe?.(topic, { onChange: (snapshot, delta) => receive(topic, snapshot, delta) }),
        ),
      )
        .then(() => syncAgentView())
        .then(() => {
          initialReady = true;
          paint();
          cs.ready?.();
        })
        .catch(report);
    </script>
  </body>
</html>
