<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="cs:type" content="dashboard" />
    <meta name="codesense:icon" content="hammer" />
    <title>CodeSense — MCP tools</title>

    <!-- Shared chrome: tokens, shell, top-nav, ⌘K palette.
         Loaded from the bundled _shared/ bundle so this doc renders unchanged
         under file://, inside the Tauri viewer, and under agent MCP preview. -->
    <link rel="stylesheet" href="./_shared/cs-docs.css" />
    <script src="./_shared/nav.js" defer></script>
    <!-- Create-repo primer: "You need an editable context repo first" affordance,
         consumed by the Try-it flow when the user is on the docs org. -->
    <script src="./_shared/create-repo-primer.js" defer></script>

    <!--
      mcp-explorer.html
      ─────────────────────────────────────────────────────────────────────
      Reference dashboard for every CodeSense MCP tool. Left: filterable list
      (search, arc select, read/write segmented, "★ Start here" toggle).
      Right: detail (description, args schema inline, returns schema, example,
      "Try it" form built from the live JSON schema). Deep-link via
      `mcp-explorer.html#tool/<name>`.

      Data source
      ───────────
      `./generated/mcp-tools.json`, authored by scripts/generate-mcp-reference.mjs
      which walks `src-tauri/src/mcp/handler.rs`. A CI gate (`npm run gen:docs:check`)
      refuses a merge if the committed JSON drifts from the handler.

      Try-it policy (ACs 5 + 6)
      ─────────────────────────
      - Read-only tool: invokes immediately via `window.codesense.invoke`.
      - Write tool: a confirm dialog arms the Run button after the user types
        the tool name (the `rm -rf` pattern).
      - No editable context repo: inline-render the create-repo primer; on
        resolve, re-fire the Try-it that triggered it.
      - Docs org only (no editable repo + a write): the primer sheet is the
        gate; the explorer never writes to a read-only org.

      No hard-coded counts (I-11): the `<data-count>` placeholders are
      resolved at runtime from the fetched manifest.
    -->

    <style>
      /* ---------- Tokens: inherit the viewer's cs-* theme; add a scoped
         fallback so this doc renders standalone (file:// + no shared stylesheet). */
      :root {
        color-scheme: light dark;
      }

      /* Light-mode fallback (only applied if the viewer's --cs-* theme is not injected). */
      @media (prefers-color-scheme: light) {
        :root:not([data-cs-theme]) {
          --cs-fg: #0f1419;
          --cs-muted-fg: #64748b;
          --cs-subtle-fg: #94a3b8;
          --cs-surface: #ffffff;
          --cs-surface-raised: #ffffff;
          --cs-inset: #f6f7f9;
          --cs-inset-strong: #eef0f3;
          --cs-border: #e2e5ea;
          --cs-border-strong: #cbd1d9;
          --cs-hover: #eef1f5;
          --cs-accent: #2563eb;
          --cs-accent-fg: #ffffff;
          --cs-accent-soft: color-mix(in srgb, var(--cs-accent) 10%, transparent);
          --cs-state-needs-you: #c2410c;
          --cs-state-ok: #15803d;
          --cs-radius: 6px;
          --cs-radius-sm: 4px;
          --cs-radius-full: 999px;
          --cs-space-1: 4px;
          --cs-space-2: 8px;
          --cs-space-3: 12px;
          --cs-space-4: 16px;
          --cs-space-5: 24px;
          --cs-space-6: 32px;
          --cs-text-xs: 11px;
          --cs-text-sm: 12.5px;
          --cs-text-md: 14px;
          --cs-text-lg: 16px;
          --cs-font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
            Roboto, system-ui, sans-serif;
          --cs-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas,
            monospace;
          --cs-shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.04), 0 1px 1px rgba(15, 20, 25, 0.02);
          --cs-shadow-md:
            0 4px 14px -4px rgba(15, 20, 25, 0.14), 0 2px 4px -2px rgba(15, 20, 25, 0.06);
        }
      }
      /* Dark-mode fallback. The real viewer wins when it injects --cs-* on <html>. */
      :root:not([data-cs-theme]) {
        --cs-fg: #e6ebf2;
        --cs-muted-fg: #93a0b1;
        --cs-subtle-fg: #6b7788;
        --cs-surface: #0e1116;
        --cs-surface-raised: #141922;
        --cs-inset: #11161e;
        --cs-inset-strong: #1a2029;
        --cs-border: #232a35;
        --cs-border-strong: #313947;
        --cs-hover: #1a212b;
        --cs-accent: #3b82f6;
        --cs-accent-fg: #ffffff;
        --cs-accent-soft: color-mix(in srgb, var(--cs-accent) 16%, transparent);
        --cs-state-needs-you: #f59e0b;
        --cs-state-ok: #22c55e;
        --cs-radius: 6px;
        --cs-radius-sm: 4px;
        --cs-radius-full: 999px;
        --cs-space-1: 4px;
        --cs-space-2: 8px;
        --cs-space-3: 12px;
        --cs-space-4: 16px;
        --cs-space-5: 24px;
        --cs-space-6: 32px;
        --cs-text-xs: 11px;
        --cs-text-sm: 12.5px;
        --cs-text-md: 14px;
        --cs-text-lg: 16px;
        --cs-font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
          Roboto, system-ui, sans-serif;
        --cs-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas,
          monospace;
        --cs-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --cs-shadow-md:
          0 4px 14px -4px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.4);
      }

      /* ---------- Base. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--cs-surface);
        color: var(--cs-fg);
        font:
          var(--cs-text-md) / 1.5 var(--cs-font-sans);
        font-feature-settings:
          "ss01",
          "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Browser surfaces we theme on purpose — the "built not assembled"
         signal and the floor for a reference dashboard. */
      ::selection {
        background: color-mix(in srgb, var(--cs-accent) 30%, transparent);
        color: var(--cs-fg);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--cs-border-strong);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--cs-muted-fg);
        background-clip: padding-box;
        border: 2px solid transparent;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      * {
        scrollbar-color: var(--cs-border-strong) transparent;
        scrollbar-width: thin;
      }
      :focus-visible {
        outline: 2px solid var(--cs-accent);
        outline-offset: 2px;
        border-radius: var(--cs-radius-sm);
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
        color: inherit;
      }

      /* ---------- Shell. 3 rows: topbar / main / footer. */
      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
        min-height: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: var(--cs-space-3);
        padding: var(--cs-space-3) var(--cs-space-4);
        border-bottom: 1px solid var(--cs-border);
        background: var(--cs-surface);
      }
      .topbar .brand {
        display: flex;
        align-items: center;
        gap: var(--cs-space-2);
        font-weight: 600;
        letter-spacing: -0.005em;
      }
      .topbar .brand .mark {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: var(--cs-radius-sm);
        background: var(--cs-fg);
        color: var(--cs-surface);
        font: 600 11px/1 var(--cs-font-mono);
      }
      .topbar .crumb {
        color: var(--cs-muted-fg);
        font-size: var(--cs-text-sm);
      }
      .topbar .crumb .sep {
        margin: 0 var(--cs-space-2);
        color: var(--cs-subtle-fg);
      }
      .topbar .count {
        margin-left: auto;
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
        font-variant-numeric: tabular-nums;
      }
      .topbar .count strong {
        color: var(--cs-fg);
        font-weight: 600;
      }

      .main {
        display: grid;
        grid-template-columns: minmax(300px, 380px) 1fr;
        min-height: 0;
        overflow: hidden;
      }

      /* ---------- Left: filter rail + list. */
      .list-col {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        border-right: 1px solid var(--cs-border);
        background: var(--cs-inset);
      }

      .filters {
        display: flex;
        flex-direction: column;
        gap: var(--cs-space-2);
        padding: var(--cs-space-3) var(--cs-space-3) var(--cs-space-3);
        border-bottom: 1px solid var(--cs-border);
        background: var(--cs-inset);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .search {
        display: flex;
        align-items: center;
        gap: var(--cs-space-2);
        padding: 0 var(--cs-space-2) 0 var(--cs-space-3);
        height: 34px;
        border-radius: var(--cs-radius);
        background: var(--cs-surface);
        border: 1px solid var(--cs-border);
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease;
      }
      .search:focus-within {
        border-color: var(--cs-accent);
        box-shadow: 0 0 0 3px var(--cs-accent-soft);
      }
      .search .ico {
        width: 14px;
        height: 14px;
        color: var(--cs-muted-fg);
        flex: none;
      }
      .search input {
        flex: 1 1 auto;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: var(--cs-text-md);
      }
      .search input::placeholder {
        color: var(--cs-subtle-fg);
      }
      .search .kbd {
        font: 500 10.5px/1 var(--cs-font-mono);
        color: var(--cs-muted-fg);
        padding: 2px 6px;
        border: 1px solid var(--cs-border);
        border-bottom-width: 2px;
        border-radius: var(--cs-radius-sm);
        background: var(--cs-inset-strong);
        flex: none;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--cs-space-1);
        align-items: center;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--cs-border);
        background: var(--cs-surface);
        border-radius: var(--cs-radius);
      }
      .seg button {
        padding: 3px 10px;
        border: 0;
        background: transparent;
        color: var(--cs-muted-fg);
        font-size: var(--cs-text-xs);
        font-weight: 500;
        border-radius: var(--cs-radius-sm);
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--cs-fg);
        color: var(--cs-surface);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 24px;
        padding: 0 10px;
        border: 1px solid var(--cs-border);
        background: var(--cs-surface);
        border-radius: var(--cs-radius-full);
        font-size: var(--cs-text-xs);
        font-weight: 500;
        color: var(--cs-muted-fg);
        cursor: pointer;
      }
      .pill:hover {
        color: var(--cs-fg);
        border-color: var(--cs-border-strong);
      }
      .pill[data-active="true"] {
        background: var(--cs-fg);
        color: var(--cs-surface);
        border-color: var(--cs-fg);
      }
      .pill .ico {
        width: 12px;
        height: 12px;
      }

      .arc-select {
        appearance: none;
        -webkit-appearance: none;
        padding: 0 24px 0 10px;
        height: 24px;
        border: 1px solid var(--cs-border);
        background: var(--cs-surface);
        color: var(--cs-fg);
        border-radius: var(--cs-radius-full);
        font-size: var(--cs-text-xs);
        font-weight: 500;
        cursor: pointer;
        background-image: linear-gradient(45deg, transparent 50%, var(--cs-muted-fg) 50%),
          linear-gradient(135deg, var(--cs-muted-fg) 50%, transparent 50%);
        background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%;
        background-size: 4px 4px, 4px 4px;
        background-repeat: no-repeat;
      }

      /* The list itself. */
      .list {
        overflow-y: auto;
        padding-bottom: var(--cs-space-5);
      }
      .group-head {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: var(--cs-space-2);
        padding: 10px var(--cs-space-3) 6px;
        background: var(--cs-inset);
        border-bottom: 1px solid var(--cs-border);
        z-index: 1;
      }
      .group-head .label {
        font: 600 10px/1 var(--cs-font-sans);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--cs-muted-fg);
      }
      .group-head .count {
        margin-left: auto;
        font-size: 10px;
        /* WCAG 2.1 AA: --cs-subtle-fg misses 4.5:1 at this
         * size; --cs-muted-fg clears it. */
        color: var(--cs-muted-fg);
        font-variant-numeric: tabular-nums;
      }
      .group-head.starter .label {
        color: var(--cs-accent);
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .group-head.starter {
        border-bottom-color: color-mix(in srgb, var(--cs-accent) 30%, var(--cs-border));
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: var(--cs-space-2);
        padding: 7px 12px 7px 16px;
        cursor: pointer;
        position: relative;
        border-left: 3px solid transparent;
        min-height: 32px;
      }
      .row:hover {
        background: var(--cs-hover);
      }
      .row[aria-selected="true"] {
        background: color-mix(in srgb, var(--cs-accent) 10%, transparent);
        border-left-color: var(--cs-accent);
      }
      .row[aria-selected="true"] .name {
        color: var(--cs-fg);
      }
      .row .name {
        font: 500 var(--cs-text-sm) / 1.3 var(--cs-font-mono);
        color: var(--cs-fg);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        letter-spacing: -0.005em;
      }
      .row .name mark {
        background: color-mix(in srgb, var(--cs-accent) 25%, transparent);
        color: inherit;
        padding: 0 1px;
        border-radius: 2px;
      }
      .row .write {
        display: inline-flex;
        align-items: center;
        font: 600 9px/1 var(--cs-font-sans);
        padding: 2px 5px;
        border-radius: var(--cs-radius-sm);
        color: var(--cs-state-needs-you);
        background: color-mix(in srgb, var(--cs-state-needs-you) 10%, transparent);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .arc-chip {
        display: inline-grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border-radius: var(--cs-radius-sm);
        background: var(--cs-inset-strong);
        color: var(--cs-muted-fg);
        font: 600 10px/1 var(--cs-font-mono);
        border: 1px solid var(--cs-border);
        cursor: pointer;
        flex: none;
      }
      .arc-chip:hover {
        color: var(--cs-fg);
        border-color: var(--cs-border-strong);
      }
      .arc-chip.is-starter {
        background: var(--cs-accent);
        color: var(--cs-accent-fg);
        border-color: transparent;
      }

      /* Hide starter rows inside their arc group when the Start-here group
         is pinned at top — avoids showing a tool twice. */
      .arc-group .row.is-starter {
        display: none;
      }

      /* ---------- Right: detail. */
      .detail-col {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        background: var(--cs-surface);
      }

      .detail-head {
        position: sticky;
        top: 0;
        padding: var(--cs-space-4) var(--cs-space-5) var(--cs-space-3);
        border-bottom: 1px solid var(--cs-border);
        background: var(--cs-surface);
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: start;
        gap: var(--cs-space-3);
        z-index: 2;
      }
      .detail-head h1 {
        margin: 0 0 2px;
        font: 600 20px/1.2 var(--cs-font-mono);
        letter-spacing: -0.01em;
      }
      .detail-head .meta {
        display: flex;
        align-items: center;
        gap: var(--cs-space-2);
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
        flex-wrap: wrap;
      }
      .detail-head .meta a {
        color: var(--cs-muted-fg);
        text-decoration: underline;
        text-decoration-color: var(--cs-border-strong);
        text-underline-offset: 2px;
        text-decoration-thickness: 1px;
        font-variant-numeric: tabular-nums;
        font-family: var(--cs-font-mono);
      }
      .detail-head .meta a:hover {
        color: var(--cs-fg);
        text-decoration-color: var(--cs-accent);
      }
      .detail-head .arc-chip {
        cursor: default;
      }
      .detail-head .arc-full {
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 12px;
        background: var(--cs-fg);
        color: var(--cs-surface);
        border: 0;
        border-radius: var(--cs-radius);
        font-size: var(--cs-text-sm);
        font-weight: 500;
        cursor: pointer;
        letter-spacing: 0;
      }
      .cta:hover {
        background: color-mix(in srgb, var(--cs-fg) 85%, var(--cs-accent) 15%);
      }
      .cta.is-write {
        background: var(--cs-state-needs-you);
        color: #fff;
      }
      .cta .ico {
        width: 13px;
        height: 13px;
      }

      .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        background: transparent;
        color: var(--cs-muted-fg);
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-radius);
        font-size: var(--cs-text-xs);
        font-weight: 500;
        cursor: pointer;
      }
      .btn-ghost:hover {
        color: var(--cs-fg);
        border-color: var(--cs-border-strong);
      }

      .detail-body {
        overflow-y: auto;
        padding: var(--cs-space-4) var(--cs-space-5) var(--cs-space-6);
      }

      .desc {
        color: var(--cs-fg);
        max-width: 68ch;
        font-size: var(--cs-text-md);
        margin: 0 0 var(--cs-space-5);
      }

      .section {
        margin: 0 0 var(--cs-space-5);
      }
      .section-label {
        display: flex;
        align-items: baseline;
        gap: var(--cs-space-2);
        margin: 0 0 var(--cs-space-2);
      }
      .section-label .l {
        font: 600 10px/1 var(--cs-font-sans);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--cs-muted-fg);
      }
      .section-label .hint {
        color: var(--cs-subtle-fg);
        font-size: var(--cs-text-xs);
      }

      /* Args as a form */
      .args-form {
        display: grid;
        gap: var(--cs-space-3);
        padding: var(--cs-space-4);
        background: var(--cs-inset);
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-radius);
      }
      .field {
        display: grid;
        gap: 4px;
      }
      .field .fname {
        font: 500 var(--cs-text-sm) / 1 var(--cs-font-mono);
        color: var(--cs-fg);
      }
      .field .fhint {
        color: var(--cs-muted-fg);
        font-size: var(--cs-text-xs);
        margin: 0;
      }
      .field textarea {
        padding: 7px 10px;
        background: var(--cs-surface);
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-radius-sm);
        font: var(--cs-text-sm) / 1.4 var(--cs-font-mono);
        color: var(--cs-fg);
      }
      .field textarea:focus-visible {
        outline: 2px solid var(--cs-accent);
        outline-offset: 1px;
        border-color: var(--cs-accent);
      }
      .field textarea {
        min-height: 68px;
        resize: vertical;
      }

      .form-actions {
        display: flex;
        align-items: center;
        gap: var(--cs-space-3);
        margin-top: var(--cs-space-2);
        padding-top: var(--cs-space-3);
        border-top: 1px dashed var(--cs-border);
      }
      .form-actions .hint {
        color: var(--cs-muted-fg);
        font-size: var(--cs-text-xs);
        margin-right: auto;
      }

      /* Returns + examples */
      .schema-tree,
      .example {
        margin: 0;
        padding: var(--cs-space-4);
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-radius);
        background: var(--cs-inset);
        font: var(--cs-text-sm) / 1.55 var(--cs-font-mono);
        white-space: pre;
        overflow-x: auto;
        color: var(--cs-fg);
      }
      .example .io {
        display: block;
        color: var(--cs-muted-fg);
        font-weight: 600;
        margin-right: var(--cs-space-2);
        user-select: none;
      }
      .example .io.in {
        color: var(--cs-accent);
      }
      .example .io.out {
        color: var(--cs-state-ok);
      }

      /* Try-it result card */
      .result {
        margin-top: var(--cs-space-3);
        border: 1px solid var(--cs-border);
        border-left: 3px solid var(--cs-state-ok);
        border-radius: var(--cs-radius);
        background: var(--cs-surface);
        overflow: hidden;
      }
      .result[data-state="error"] {
        border-left-color: var(--cs-state-needs-you);
      }
      .result[data-state="loading"] {
        border-left-color: var(--cs-accent);
      }
      .result .r-head {
        display: flex;
        align-items: center;
        gap: var(--cs-space-2);
        padding: 8px var(--cs-space-3);
        background: var(--cs-inset);
        border-bottom: 1px solid var(--cs-border);
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
        font-variant-numeric: tabular-nums;
      }
      .result .r-head strong {
        color: var(--cs-fg);
        font-weight: 600;
      }
      .result .r-body {
        padding: var(--cs-space-3);
        font: var(--cs-text-sm) / 1.5 var(--cs-font-mono);
        white-space: pre-wrap;
        max-height: 340px;
        overflow: auto;
      }
      .result .spin {
        display: inline-block;
        width: 11px;
        height: 11px;
        border: 1.5px solid var(--cs-border);
        border-top-color: var(--cs-accent);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation: none;
          border-top-color: transparent;
          border-left-color: var(--cs-accent);
        }
      }

      /* create-repo primer host — rendered inline when the user needs an editable repo. */
      .primer-host {
        margin-top: var(--cs-space-3);
      }
      .primer-host .cs-docs-card {
        padding: var(--cs-space-3) var(--cs-space-4);
        background: color-mix(in srgb, var(--cs-accent) 6%, var(--cs-inset));
        border: 1px solid color-mix(in srgb, var(--cs-accent) 30%, var(--cs-border));
        border-radius: var(--cs-radius);
      }

      /* Empty detail state */
      .empty-detail {
        display: grid;
        place-items: center;
        text-align: center;
        padding: var(--cs-space-6);
        color: var(--cs-muted-fg);
        height: 100%;
      }
      .empty-detail .big {
        font-size: 36px;
        margin-bottom: var(--cs-space-3);
        color: var(--cs-subtle-fg);
      }
      .empty-detail .hint {
        font-size: var(--cs-text-sm);
        max-width: 36ch;
        margin: 0 auto;
      }
      .empty-detail .kbd {
        display: inline-block;
        font: 500 11px/1 var(--cs-font-mono);
        padding: 2px 6px;
        border: 1px solid var(--cs-border);
        border-bottom-width: 2px;
        border-radius: var(--cs-radius-sm);
        background: var(--cs-inset);
        color: var(--cs-fg);
      }

      /* Error / loading banner for the manifest fetch itself. */
      .load-banner {
        padding: var(--cs-space-4) var(--cs-space-5);
        color: var(--cs-muted-fg);
        font-size: var(--cs-text-sm);
      }
      .load-banner code {
        font-family: var(--cs-font-mono);
        color: var(--cs-fg);
      }

      /* ---------- Footer: persistent keyboard legend. */
      .footer {
        display: flex;
        align-items: center;
        gap: var(--cs-space-4);
        padding: 6px var(--cs-space-4);
        border-top: 1px solid var(--cs-border);
        background: var(--cs-inset);
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
        min-height: 30px;
      }
      .footer .legend {
        display: flex;
        gap: var(--cs-space-3);
        flex-wrap: wrap;
      }
      .footer .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .footer .legend .kbd {
        font: 500 10px/1 var(--cs-font-mono);
        padding: 1.5px 5px;
        border: 1px solid var(--cs-border);
        border-bottom-width: 2px;
        border-radius: 3px;
        background: var(--cs-surface);
        color: var(--cs-fg);
      }
      .footer .r {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      .footer .gen {
        /* WCAG 2.1 AA: --cs-subtle-fg is below 4.5:1. */
        color: var(--cs-muted-fg);
        margin-right: var(--cs-space-3);
      }

      /* Confirm dialog for ⚠ WRITE. */
      dialog.confirm {
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-radius);
        background: var(--cs-surface);
        color: var(--cs-fg);
        padding: 0;
        max-width: 460px;
        width: 92vw;
        box-shadow: var(--cs-shadow-md);
      }
      dialog.confirm::backdrop {
        background: rgba(10, 14, 20, 0.55);
        backdrop-filter: blur(2px);
      }
      dialog.confirm .d-head {
        display: flex;
        align-items: center;
        gap: var(--cs-space-2);
        padding: var(--cs-space-4);
        border-bottom: 1px solid var(--cs-border);
      }
      dialog.confirm .d-head .warn {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        background: var(--cs-state-needs-you);
        color: #fff;
        border-radius: var(--cs-radius-sm);
        font-weight: 700;
      }
      dialog.confirm .d-head h2 {
        font: 600 var(--cs-text-md) / 1.3 var(--cs-font-sans);
        margin: 0;
      }
      dialog.confirm .d-body {
        padding: var(--cs-space-4);
        display: grid;
        gap: var(--cs-space-3);
      }
      dialog.confirm .d-body p {
        margin: 0;
        font-size: var(--cs-text-sm);
        color: var(--cs-fg);
      }
      dialog.confirm .d-body .args {
        padding: var(--cs-space-3);
        background: var(--cs-inset);
        border-radius: var(--cs-radius-sm);
        font: var(--cs-text-sm) / 1.5 var(--cs-font-mono);
        max-height: 180px;
        overflow: auto;
        white-space: pre;
      }
      dialog.confirm .d-body .arm label {
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
        display: block;
        margin-bottom: 4px;
      }
      dialog.confirm .d-body .arm input {
        width: 100%;
        padding: 8px 10px;
        background: var(--cs-surface);
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-radius-sm);
        font: var(--cs-text-sm) / 1 var(--cs-font-mono);
        color: var(--cs-fg);
      }
      dialog.confirm .d-body .arm input:focus-visible {
        outline: 2px solid var(--cs-accent);
        outline-offset: 1px;
        border-color: var(--cs-accent);
      }
      dialog.confirm .d-foot {
        display: flex;
        justify-content: flex-end;
        gap: var(--cs-space-2);
        padding: var(--cs-space-3) var(--cs-space-4);
        border-top: 1px solid var(--cs-border);
        background: var(--cs-inset);
      }

      /* ---------- Narrow: detail becomes a slide-over. */
      @media (max-width: 820px) {
        .main {
          grid-template-columns: 1fr;
        }
        .detail-col {
          position: fixed;
          inset: 0;
          z-index: 10;
          transform: translateX(100%);
          transition: transform 180ms ease;
          border-left: 1px solid var(--cs-border);
          box-shadow: var(--cs-shadow-md);
        }
        .app[data-detail-open="true"] .detail-col {
          transform: translateX(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .detail-col {
          transition: none;
        }
      }
    </style>
  </head>

  <body class="cs-page cs-docs" data-page="mcp-explorer">
    <div class="app" id="app" data-detail-open="false" data-state="loading">
      <!-- Topbar -->
      <header class="topbar" role="banner">
        <div class="brand"><span class="mark">cs</span> <span>CodeSense</span></div>

          <strong><data-count id="mcp-tools">0</data-count></strong> tools ·

      <!-- Main: list + detail -->

                <path d="m20 20-3.5-3.5"></path>

                id="q"

            <div class="filter-row">
              <select class="arc-select" id="arcSel" aria-label="Filter by arc">
                <option value="">All arcs</option>

                <option value="B">B · Agents & accounts</option>
                <option value="C">C · Workspaces</option>
                <option value="D">D · Terminals & machines</option>
                <option value="E">E · Agents as processes</option>
                <option value="F">F · Inboxes & messaging</option>
                <option value="G">G · Routines</option>
                <option value="H">H · Pipelines (Weft)</option>

              <div class="seg" role="group" aria-label="Read/write filter">

      <!-- Footer: keyboard legend + generator stamp -->
      <footer class="footer" role="contentinfo">

          <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
          <span><span class="kbd">↵</span> open</span>

          <span><span class="kbd">Esc</span> clear</span>

    <!-- WRITE confirm dialog -->
    <dialog class="confirm" id="confirm">
      <form method="dialog">
        <div class="d-head">
          <span class="warn" aria-hidden="true">!</span>
          <h2>This tool writes.</h2>
        </div>
        <div class="d-body">
          <p id="confirmLede"></p>
          <div class="args" id="confirmArgs"></div>
          <div class="arm">
            <label for="armInput"
              >To arm the <strong>Run</strong> button, type the tool name:</label
            >
            <input id="armInput" type="text" autocomplete="off" spellcheck="false" />
          </div>
        </div>
        <div class="d-foot">
          <button class="btn-ghost" value="cancel" type="submit">Cancel</button>
          <button class="cta is-write" id="confirmRun" value="confirm" type="submit" disabled>
            <svg
              class="ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="5 3 19 12 5 21 5 3"></polygon>

    <script>
      /* ============================================================
       * mcp-explorer
       *
       * Loads `generated/mcp-tools.json` (produced by
       * scripts/generate-mcp-reference.mjs on every build) and renders
       * a list-detail reference for every CodeSense MCP tool. Deep-link
       * via `#tool/<name>`.
       *
       * Try-it (ACs 5 + 6):
       *   - Read-only: invokes immediately via window.codesense.invoke.
       *   - Write: confirms via a dialog that arms the Run button after
       *     the user types the tool name.
       *   - No editable context repo: mounts the create-repo primer inline
       *     (window.codesense.docs.mountInlineAffordance). On repo-ready,
       *     the Try-it re-fires with the originally-collected args.
       * ============================================================ */

      const ARC_NAMES = {
        A: "First touch",
        B: "Agents & accounts",
        C: "Workspaces & worktrees",
        D: "Terminals & machines",
        E: "Agents as processes",
        F: "Inboxes & messaging",
        G: "Routines",
        H: "Pipelines (Weft)",
        I: "Dashboards & UI",
        J: "MCP meta",
        K: "Sync & git",
        L: "Factory & content",
        "?": "Unclassified",
      };

      /** The manifest; populated by loadTools(). */
      let TOOLS = [];
      let MANIFEST = null;

      const state = {
        q: "",
        arc: "",
        rw: "", // "", "r", "w"
        starterOnly: false,
        selected: null, // tool name
        filtered: [],
      };

      /* ---------- DOM helpers ---------- */
      const $ = (id) => document.getElementById(id);
      const h = (tag, attrs, ...kids) => {
        const el = document.createElement(tag);
        if (attrs)
          for (const k in attrs) {
            if (k === "class") el.className = attrs[k];
            else if (k === "html") el.innerHTML = attrs[k];
            else if (k === "text") el.textContent = attrs[k];
            else if (k.startsWith("on") && typeof attrs[k] === "function")
              el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
            else if (attrs[k] === false || attrs[k] == null) continue;
            else el.setAttribute(k, attrs[k]);
          }
        for (const kid of kids.flat()) {
          if (kid == null || kid === false) continue;
          el.append(kid.nodeType ? kid : document.createTextNode(kid));
        }
        return el;
      };

      /* ---------- Manifest load ---------- */
      function loadTools() {
        return fetch("./generated/mcp-tools.json", { credentials: "same-origin" })
          .then((res) => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then((doc) => {
            if (!doc || !Array.isArray(doc.tools))
              throw new Error("Malformed mcp-tools.json");
            MANIFEST = doc;
            TOOLS = doc.tools;
            resolveDataCounts();
            document.getElementById("app").dataset.state = "ready";
            $("listBanner")?.remove();
            if (doc.generatedAt && doc.generatedAt !== "deterministic") {
              $("genStamp").textContent = "generated " + doc.generatedAt;
            } else {
              $("genStamp").textContent = "handler.rs @ build";
            }
            applyFilters();
            renderList();
            fromHash();
          })
          .catch((err) => {
            document.getElementById("app").dataset.state = "error";
            const banner = $("listBanner");
            if (banner) {
              banner.innerHTML =
                "Couldn't load <code>generated/mcp-tools.json</code> (" +
                escapeHtml((err && err.message) || String(err)) +
                "). Open this page inside CodeSense (or the dev viewer) so it's reachable same-origin.";
            }
          });
      }

      /** Resolve the `<data-count>` placeholders in the header from the loaded
       *  manifest. I-11: nothing in shipped copy may hard-code these numbers. */
      function resolveDataCounts() {
        const total = TOOLS.length;
        const reads = TOOLS.filter((t) => !t.write).length;
        const writes = TOOLS.filter((t) => t.write).length;
        setCount("mcp-tools", total);
        setCount("mcp-tools-read", reads);
        setCount("mcp-tools-write", writes);
      }
      function setCount(id, n) {
        document.querySelectorAll('data-count[id="' + id + '"]').forEach((el) => {
          el.textContent = String(n);
          el.setAttribute("data-count-resolved", "true");
        });
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      /* ---------- Filtering ---------- */
      function applyFilters() {
        const q = state.q.trim().toLowerCase();
        state.filtered = TOOLS.filter((t) => {
          if (state.arc && t.arc !== state.arc) return false;
          if (state.rw === "r" && t.write) return false;
          if (state.rw === "w" && !t.write) return false;
          if (state.starterOnly && !t.starter) return false;
          if (q) {
            const hay = (t.name + " " + (t.description || "")).toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      /* ---------- List render ---------- */
      function highlight(name) {
        const q = state.q.trim().toLowerCase();
        if (!q) return document.createTextNode(name);
        const i = name.toLowerCase().indexOf(q);
        if (i < 0) return document.createTextNode(name);
        const frag = document.createDocumentFragment();
        frag.append(name.slice(0, i));
        const m = h("mark", null, name.slice(i, i + q.length));
        frag.append(m);
        frag.append(name.slice(i + q.length));
        return frag;
      }

      function row(tool) {
        // Arc chip is a styled span (not a nested button) so the listbox
        // option stays a flat non-nested interactive region (WCAG 2.1 AA).
        // Keyboard filtering by arc is reachable via the
        // arc filter controls above the list; the chip's visual role is as
        // a tag.
        return h(
          "div",
          {
            class: "row" + (tool.starter ? " is-starter" : ""),
            role: "option",
            tabindex: "-1",
            "data-name": tool.name,
            "aria-selected": tool.name === state.selected ? "true" : "false",
            onclick: () => select(tool.name, { scroll: false }),
          },
          h("span", { class: "name" }, highlight(tool.name)),
          tool.write ? h("span", { class: "write", title: "This tool writes" }, "⚠ W") : null,
          h(
            "span",
            {
              class: "arc-chip" + (tool.starter ? " is-starter" : ""),
              title: `Arc ${tool.arc}`,
              "aria-hidden": "true",
            },
            tool.arc,
          ),
        );
      }

      function renderList() {
        const list = $("list");
        list.replaceChildren();

        // Starter group (always first, when any starters pass the filter).
        const starters = state.filtered.filter((t) => t.starter);
        if (starters.length) {
          list.append(
            h(
              "div",
              { class: "group-head starter" },
              h(
                "span",
                { class: "label" },
                h("svg", {
                  class: "ico",
                  viewBox: "0 0 24 24",
                  fill: "currentColor",
                  "aria-hidden": "true",
                  width: "11",
                  height: "11",
                  html:
                    '<path d="M12 2l2.4 7.2H22l-6 4.5 2.3 7.3L12 16.9 5.7 21l2.3-7.3-6-4.5h7.6z"/>',
                }),
                "Start here",
              ),
              h("span", { class: "count" }, String(starters.length)),
            ),
          );
          for (const t of starters) {
            const r = row(t);
            r.classList.remove("is-starter"); // visible inside starter group
            list.append(r);
          }
        }

        // Then by arc. Skip starters in their arc group (CSS hides them anyway).
        const byArc = {};
        for (const t of state.filtered) {
          if (!byArc[t.arc]) byArc[t.arc] = [];
          byArc[t.arc].push(t);
        }
        const arcs = Object.keys(byArc).sort();
        for (const arc of arcs) {
          const group = byArc[arc];
          list.append(
            h(
              "div",
              { class: "group-head" },
              h("span", { class: "label" }, `${arc} · ${ARC_NAMES[arc] || "Other"}`),
              h("span", { class: "count" }, String(group.length)),
            ),
            h("div", { class: "arc-group" }, group.map(row)),
          );
        }

        // Counts
        const shown = state.filtered.length;
        setCount("mcp-tools-visible", shown);
        $("footCount").textContent = `${shown} shown`;
      }

      /* ---------- Detail render ---------- */
      function schemaTree(schema) {
        return h("pre", { class: "schema-tree" }, JSON.stringify(schema, null, 2));
      }

      function argsForm(tool) {
        const example = (tool.examples || []).find((call) => call.tool === tool.name);
        return h(
          "form",
          { class: "args-form", id: "tryForm", onsubmit: (event) => { event.preventDefault(); tryRun(tool); } },
          h("div", { class: "field" },
            h("label", { for: "tryArguments", class: "fname" }, "Arguments JSON"),
            h("textarea", { id: "tryArguments", name: "arguments", rows: "10", spellcheck: "false" },
              JSON.stringify(example ? example.arguments : {}, null, 2)),
            h("p", { class: "fhint" }, "Enter one JSON object using the argument schema above.")),
          h("div", { class: "form-actions" },
            h("span", { class: "hint" }, tool.write ? "Writes: a confirm dialog arms the run." : "Read-only: runs immediately."),
            h("button", { class: tool.write ? "cta is-write" : "cta", type: "submit" },
              tool.write ? "Try it (write) → ⌘↵" : "Try it → ⌘↵")),
          h("div", { id: "tryResult" }),
          h("div", { id: "tryPrimer", class: "primer-host" }),
        );
      }

      function renderDetail() {
        const target = $("detail");
        const tool = TOOLS.find((t) => t.name === state.selected);
        if (!tool) {
          target.replaceChildren(
            h(
              "div",
              { class: "empty-detail" },
              h("div", { class: "big" }, "⌁"),
              h(
                "p",
                { class: "hint" },
                "Press ",
                h("span", { class: "kbd" }, "/"),
                " and start typing. ",
                h("br"),
                "Or deep-link ",
                h("span", { class: "kbd" }, "mcp-explorer.html#tool/<name>"),
                ".",
              ),
            ),
          );
          return;
        }

        const head = h(
          "header",
          { class: "detail-head" },
          h(
            "div",
            {},
            h("h1", {}, tool.name),
            h(
              "div",
              { class: "meta" },
              h("span", { class: "arc-chip", title: `Arc ${tool.arc}` }, tool.arc),
              h("span", { class: "arc-full" }, ARC_NAMES[tool.arc] || "Other"),
              h("span", {}, "·"),
              tool.write
                ? h(
                    "span",
                    {
                      class: "write",
                      style:
                        "font-size:9px;padding:2px 5px;border-radius:4px;font-weight:600;color:var(--cs-state-needs-you);background:color-mix(in srgb, var(--cs-state-needs-you) 10%, transparent);letter-spacing:0.05em;text-transform:uppercase;",
                    },
                    "⚠ WRITE",
                  )
                : h(
                    "span",
                    {
                      style:
                        "font-size:10px;color:var(--cs-state-ok);font-weight:600;letter-spacing:0.05em;text-transform:uppercase;",
                    },
                    "read-only",
                  ),
              h("span", {}, "·"),
              h(
                "a",
                {
                  href: "#",
                  title: "Open in source",
                  onclick: (e) => {
                    e.preventDefault();
                    openSource(tool);
                  },
                },
                tool.sourceRef,
              ),
              tool.core
                ? h(
                    "span",
                    {
                      style:
                        "font-size:10px;padding:1px 5px;border-radius:3px;background:var(--cs-inset-strong);color:var(--cs-muted-fg);margin-left:4px;",
                    },
                    "always advertised",
                  )
                : null,
              tool.starter
                ? h(
                    "span",
                    {
                      style:
                        "font-size:10px;padding:1px 5px;border-radius:3px;background:var(--cs-accent-soft);color:var(--cs-accent);margin-left:4px;font-weight:600;",
                    },
                    "START HERE",
                  )
                : null,
            ),
          ),
          h(
            "button",
            {
              class: tool.write ? "cta is-write" : "cta",
              onclick: () => tryRun(tool),
            },
            h("svg", {
              class: "ico",
              viewBox: "0 0 24 24",
              fill: "none",
              stroke: "currentColor",
              "stroke-width": "2",
              "stroke-linecap": "round",
              "stroke-linejoin": "round",
              html: '<polygon points="5 3 19 12 5 21 5 3"/>',
            }),
            tool.write ? "Try (write)" : "Try it",
          ),
        );

        const body = h(
          "div",
          { class: "detail-body" },
          h("p", { class: "desc" }, tool.description),

          h(
            "section",
            { class: "section" },
            h(
              "div",
              { class: "section-label" },
              h("span", { class: "l" }, "Arguments"),
              h("span", { class: "hint" }, "live JSON schema"),
            ),
            schemaTree(tool.params),
          ),

          h(
            "section",
            { class: "section" },
            h(
              "div",
              { class: "section-label" },
              h("span", { class: "l" }, "Returns"),
            ),
            tool.returns ? schemaTree(tool.returns) : h("p", { class: "hint" }, "This tool does not advertise an output schema. Its description explains the returned data."),
          ),

          tool.examples && tool.examples.length
            ? h(
                "section",
                { class: "section" },
                h(
                  "div",
                  { class: "section-label" },
                  h("span", { class: "l" }, "Family example"),
                ),
                h(
                  "pre",
                  { class: "example" },
                  h("span", { class: "io in" }, "» " + tool.examples[0].tool),
                  "\n",
                  JSON.stringify(tool.examples[0].arguments, null, 2),

                ),
              )
            : null,

          h(
            "section",
            { class: "section" },
            h(
              "div",
              { class: "section-label" },
              h("span", { class: "l" }, "Try it"),
              h(
                "span",
                { class: "hint" },
                tool.write
                  ? "writes — confirm required"
                  : "read-only — invokes immediately",
              ),
            ),
            argsForm(tool),
          ),
        );

        target.replaceChildren(head, body);
      }

      /* ---------- Try-it ---------- */
      async function tryRun(tool) {
        let args;
        try {
          args = JSON.parse($("tryArguments").value);
          if (!args || typeof args !== "object" || Array.isArray(args)) {
            throw new Error("Arguments must be a JSON object.");
          }
        } catch (error) {
          $("tryResult").replaceChildren(h("div", { class: "result", "data-state": "error" },
            h("strong", {}, "Invalid arguments"), h("pre", {}, error.message)));
          return;
        }

        // create-repo primer: Try-it drives the user's editable context repo, not
        // the read-only docs org. If no editable repo exists, mount the primer
        // and let the user resolve the gap; on success, re-fire this run.
        const docs = window.codesense && window.codesense.docs;
        if (docs && typeof docs.hasEditableRepo === "function") {
          try {
            const ok = await docs.hasEditableRepo();
            if (!ok) {
              return mountPrimerThenRetry(tool, args);
            }
          } catch (_) {
            /* fall through — treat as "unknown"; the invoke itself will
               surface a refusal and we'll show the primer on error below. */
          }
        }

        if (tool.write) {
          const ok = await confirmWrite(tool, args);
          if (!ok) return;
        }
        await invoke(tool, args);
      }

      function mountPrimerThenRetry(tool, args) {
        const host = $("tryPrimer");
        const docs = window.codesense && window.codesense.docs;
        if (!host || !docs || typeof docs.mountInlineAffordance !== "function") {
          // No bridge; render a minimal copy of the refusal so the user is not
          // confused when running from file://.
          if (host) {
            host.innerHTML =
              '<div class="cs-docs-card" role="status">' +
              '<p style="margin:0;">' +
              "You need an editable context repo first — CodeSense docs are read-only." +
              "</p></div>";
          }
          return;
        }
        docs.mountInlineAffordance(host, {
          onRetry: () => {
            host.replaceChildren();
            // Re-fire with the same args the user already typed.
            invokeWithOptionalConfirm(tool, args);
          },
        });
      }

      async function invokeWithOptionalConfirm(tool, args) {
        if (tool.write) {
          const ok = await confirmWrite(tool, args);
          if (!ok) return;
        }
        await invoke(tool, args);
      }

      function confirmWrite(tool, args) {
        return new Promise((resolve) => {
          const dlg = $("confirm");
          $("confirmLede").textContent = `${tool.name} will perform a durable write. Review the arguments; this is not reversible by this dashboard.`;
          $("confirmArgs").textContent = JSON.stringify(args, null, 2) || "(no arguments)";
          const run = $("confirmRun");
          const arm = $("armInput");
          arm.value = "";
          run.disabled = true;
          arm.oninput = () => {
            run.disabled = arm.value.trim() !== tool.name;
          };
          dlg.onclose = () => {
            resolve(dlg.returnValue === "confirm");
          };
          dlg.showModal();
          arm.focus();
        });
      }

      async function invoke(tool, args) {
        const resultEl = $("tryResult");
        if (!resultEl) return;
        resultEl.replaceChildren(
          h(
            "div",
            { class: "result", "data-state": "loading" },
            h(
              "div",
              { class: "r-head" },
              h("span", { class: "spin" }),
              h("span", {}, "Invoking "),
              h("strong", {}, tool.name),
              h("span", {}, " …"),
            ),
          ),
        );

        const started = performance.now();
        let out, err;
        try {
          if (window.codesense && typeof window.codesense.invoke === "function") {
            out = await window.codesense.invoke(tool.name, args);
          } else {
            // Fallback: no bridge (e.g. opened from file://). Explain, don't fail silently.
            await new Promise((r) => setTimeout(r, 180));
            throw new Error(
              "Open this page inside CodeSense (or the dev viewer); window.codesense.invoke is not available here.",
            );
          }
        } catch (e) {
          err = e;
          // A refusal from the docs org means the bridge is pointed at
          // a read-only org. Mount the primer so the user can create an editable
          // repo and re-fire.
          if (isDocsOrgRefusal(err)) {
            const host = $("tryPrimer");
            const docs = window.codesense && window.codesense.docs;
            if (host && docs && typeof docs.mountInlineAffordance === "function") {
              docs.mountInlineAffordance(host, {
                onRetry: () => {
                  host.replaceChildren();
                  invokeWithOptionalConfirm(tool, args);
                },
              });
            }
          }
        }
        const ms = Math.round(performance.now() - started);

        resultEl.replaceChildren(
          h(
            "div",
            { class: "result", "data-state": err ? "error" : "ok" },
            h(
              "div",
              { class: "r-head" },
              h("strong", {}, err ? "Error" : "Result"),
              h("span", {}, "·"),
              h("span", {}, `${ms} ms`),
              h(
                "span",
                { style: "margin-left:auto;" },
                window.codesense && window.codesense.invoke ? "live" : "no bridge",
              ),
            ),
            h(
              "div",
              { class: "r-body" },
              err ? String((err && err.message) || err) : JSON.stringify(out, null, 2),
            ),
          ),
        );
      }

      function isDocsOrgRefusal(err) {
        if (!err) return false;
        const s = String((err && err.message) || err).toLowerCase();
        return (
          s.includes("read-only") || s.includes("refused") || s.includes("refuse_write")
        );
      }

      /* ---------- Selection + deep-link ---------- */
      function select(name, { scroll = true, pushHash = true } = {}) {
        state.selected = name;
        for (const r of document.querySelectorAll(".row")) {
          r.setAttribute("aria-selected", r.dataset.name === name ? "true" : "false");
        }
        if (scroll) {
          const sel = document.querySelector(`.row[aria-selected="true"]`);
          if (sel) sel.scrollIntoView({ block: "nearest" });
        }
        renderDetail();
        if (pushHash) {
          const next = name ? `#tool/${name}` : "";
          if (location.hash !== next)
            history.replaceState(null, "", location.pathname + location.search + next);
        }
        $("app").dataset.detailOpen = name ? "true" : "false";
      }

      function openSource(tool) {
        if (window.codesense && typeof window.codesense.openSource === "function") {
          window.codesense.openSource("src-tauri/src/mcp/" + tool.sourceRef);
        } else {
          console.log("[mcp-explorer] openSource", tool.sourceRef);
        }
      }

      /* ---------- Keyboard ---------- */
      function visibleRows() {
        return Array.from(document.querySelectorAll(".row")).filter(
          (r) => r.offsetParent !== null,
        );
      }
      function moveSelection(delta) {
        const rows = visibleRows();
        if (!rows.length) return;
        const idx = rows.findIndex((r) => r.getAttribute("aria-selected") === "true");
        const next = Math.max(
          0,
          Math.min(rows.length - 1, idx < 0 ? 0 : idx + delta),
        );
        select(rows[next].dataset.name, { scroll: true });
      }

      function setArc(a) {
        state.arc = state.arc === a ? "" : a;
        $("arcSel").value = state.arc;
        applyFilters();
        renderList();
      }
      function setRW(rw) {
        state.rw = rw;
        for (const b of document.querySelectorAll(".seg [data-rw]"))
          b.setAttribute("aria-pressed", b.dataset.rw === rw ? "true" : "false");
        applyFilters();
        renderList();
      }
      function setStarterOnly(v) {
        state.starterOnly = v;
        const t = $("starterToggle");
        t.dataset.active = v ? "true" : "false";
        t.setAttribute("aria-pressed", v ? "true" : "false");
        applyFilters();
        renderList();
      }

      /* ---------- Hash ---------- */
      function fromHash() {
        const m = /^#tool\/(.+)$/.exec(location.hash);
        if (m && TOOLS.find((t) => t.name === m[1])) {
          select(m[1], { scroll: true, pushHash: false });
        }
      }

      /* ---------- Boot ---------- */
      function boot() {
        $("q").addEventListener("input", (e) => {
          state.q = e.target.value;
          applyFilters();
          renderList();
        });
        $("arcSel").addEventListener("change", (e) => {
          state.arc = e.target.value;
          applyFilters();
          renderList();
        });
        for (const b of document.querySelectorAll(".seg [data-rw]"))
          b.addEventListener("click", () => setRW(b.dataset.rw));
        $("starterToggle").addEventListener("click", () => setStarterOnly(!state.starterOnly));

        document.addEventListener("keydown", (e) => {
          const inField = ["INPUT", "TEXTAREA", "SELECT"].includes(
            document.activeElement && document.activeElement.tagName,
          );
          if (e.key === "/" && !inField) {
            e.preventDefault();
            $("q").focus();
            $("q").select();
            return;
          }
          if (e.key === "Escape") {
            if (document.activeElement === $("q")) {
              state.q = "";
              $("q").value = "";
              applyFilters();
              renderList();
              return;
            }
            if ($("app").dataset.detailOpen === "true") {
              $("app").dataset.detailOpen = "false";
              return;
            }
          }
          if (e.key === "ArrowDown" && !inField) {
            e.preventDefault();
            moveSelection(+1);
            return;
          }
          if (e.key === "ArrowUp" && !inField) {
            e.preventDefault();
            moveSelection(-1);
            return;
          }
          if (e.key === "Enter" && !inField) {
            e.preventDefault();
            const btn = document.querySelector(".detail-head .cta");
            if (btn) btn.focus();
            return;
          }
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
            e.preventDefault();
            const form = document.getElementById("tryForm");
            if (form) form.requestSubmit();
            return;
          }
          if (e.key === "g" && !inField) {
            e.preventDefault();
            const arcs = ["", "A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"];
            const idx = arcs.indexOf(state.arc);
            setArc(arcs[(idx + 1) % arcs.length]);
          }
        });

        window.addEventListener("hashchange", fromHash);

        loadTools();
      }

      boot();
    </script>
  </body>
</html>
