<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="codesense:icon" content="inbox" />
    <meta name="codesense:surface" content="human-inbox" />
    <meta name="codesense:slots" content="right-pane" />
    <!-- Policy: the Inbox keeps its unread badge live while hidden. -->
    <meta name="codesense:badge" content="live" />
    <!-- Policy: inbox:write admits markRead, markUnread, archive and react under open and team-safe. -->
    <meta
      name="codesense:capabilities"
      content="sessions:read inbox:read:team inbox:read:all-teams inbox:write context:read commands:run"
    />
    <meta
      name="codesense:commands"
      content='[
        {"id":"next-conversation","label":"Next conversation","icon":"chevron-down","scope":"slot-focused"},
        {"id":"previous-conversation","label":"Previous conversation","icon":"chevron-up","scope":"slot-focused"},
        {"id":"back-to-list","label":"Back to list","icon":"arrow-left","scope":"slot-focused"},
        {"id":"reply","label":"Reply","icon":"reply","scope":"slot-focused"},
        {"id":"go-to-session","label":"Go to session","icon":"square-terminal","scope":"slot-focused"},
        {"id":"archive-conversation","label":"Archive conversation","icon":"archive","scope":"slot-focused"},
        {"id":"new-message","label":"New message","icon":"square-pen","scope":"slot-focused"},
        {"id":"filter-by-team","label":"Filter by team","icon":"layers","scope":"slot-focused"},
        {"id":"toggle-list","label":"Toggle conversation list","icon":"panel-left","defaultChord":"CmdOrCtrl+B","scope":"slot-focused"}
      ]'
    />
    <title>Inbox</title>
    <!-- The public page SDK keeps a team copy scoped to its host team.
     Install the same bytes privately for the cross-team human inbox. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--cs-bg);
        color: var(--cs-fg);
      }
      [hidden] {
        display: none !important;
      }
      .ib {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--cs-bg);
        color: var(--cs-fg);
        font: var(--cs-text-base)/var(--cs-leading) var(--cs-font-sans);
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      /* Needs-you colour, one switch: var(--cs-state-needs-you) matches the agent list. */
      .ib {
        --ib-needs: var(--cs-accent);
      }
      .ib-tstate {
        margin-left: 6px;
        font-size: var(--cs-text-xs);
        font-weight: 400;
        color: var(--cs-muted-fg);
      }
      .ib-tstate.running {
        color: var(--cs-state-running);
      }
      .ib *,
      .ib *::before,
      .ib *::after {
        box-sizing: border-box;
      }
      .ib :where(button) {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .ib :focus-visible {
        outline: 2px solid var(--cs-accent);
        outline-offset: 1px;
        border-radius: var(--cs-radius-sm);
      }
      .ib ::selection {
        background: color-mix(in srgb, var(--cs-accent) 28%, transparent);
      }
      .ib svg.i {
        width: 15px;
        height: 15px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ib kbd {
        font: 500 10.5px var(--cs-font-mono);
        color: var(--cs-muted-fg);
        border: 1px solid var(--cs-border);
        border-bottom-width: 2px;
        border-radius: var(--cs-radius-sm);
        padding: 0 4px;
        line-height: 15px;
      }
      .ib .scroll {
        overflow-y: auto;
      }
      .ib .scroll::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      .ib .scroll::-webkit-scrollbar-track {
        background: var(--cs-surface);
      }
      .ib .scroll::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--cs-muted-fg) 85%, var(--cs-bg));
        background-clip: content-box;
        border: 2px solid transparent;
        border-radius: 10px;
      }
      .ib .scroll::-webkit-scrollbar-thumb:hover {
        background-color: var(--cs-muted-fg);
      }
      .ib .trunc {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .ib .sp {
        flex: 1;
      }

      /* head: the right-pane chrome already names the panel and shows the badge */
      .ib-head {
        display: flex;
        align-items: center;
        gap: var(--cs-space-2);
        height: 40px;
        padding: 0 var(--cs-space-2) 0 var(--cs-space-3);
        border-bottom: 1px solid var(--cs-border);
        flex: none;
      }
      .ib-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        border-radius: var(--cs-radius);
        font-size: var(--cs-text-sm);
        color: var(--cs-fg);
        white-space: nowrap;
      }
      .ib-btn:hover {
        background: var(--cs-hover);
      }
      .ib-btn.icon {
        width: 26px;
        padding: 0;
        justify-content: center;
        color: var(--cs-muted-fg);
      }
      .ib-btn.icon:hover {
        color: var(--cs-fg);
      }
      .ib-btn.primary {
        background: var(--cs-accent);
        color: var(--cs-accent-fg);
        font-weight: 500;
      }
      .ib-btn.primary:hover {
        background: color-mix(in srgb, var(--cs-accent) 88%, var(--cs-fg));
      }
      .ib-btn.primary[disabled] {
        background: var(--cs-inset);
        color: var(--cs-muted-fg);
        cursor: not-allowed;
      }
      .ib-btn.outline {
        box-shadow: inset 0 0 0 1px var(--cs-border);
      }
      .ib-btn.outline:hover {
        background: var(--cs-hover);
      }
      .ib-btn.primary kbd {
        color: inherit;
        border-color: color-mix(in srgb, var(--cs-accent-fg) 40%, transparent);
        opacity: 0.85;
      }

      /* presence */
      .ib-presence {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 6px 0 8px;
        border-radius: var(--cs-radius-full);
        font-size: var(--cs-text-sm);
        color: var(--cs-muted-fg);
      }
      .ib-presence:hover,
      .ib-presence[aria-expanded="true"] {
        background: var(--cs-hover);
        color: var(--cs-fg);
      }
      .ib-pdot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .ib-pdot.online {
        background: var(--cs-success);
      }
      .ib-pdot.away {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--cs-warning);
      }
      .ib-pdot.busy {
        background: var(--cs-danger);
      }
      .ib-pdot.offline {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--cs-muted-fg);
      }
      .ib-presence .note {
        max-width: 120px;
      }

      /* floating menus: the only things with a shadow */
      .ib-menu {
        position: absolute;
        z-index: 5;
        background: var(--cs-bg);
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-radius-lg);
        box-shadow: var(--cs-shadow);
        padding: var(--cs-space-1);
      }
      .ib-menu .opt {
        display: flex;
        align-items: center;
        gap: var(--cs-space-2);
        width: 100%;
        height: 30px;
        padding: 0 var(--cs-space-2);
        border-radius: var(--cs-radius);
        font-size: var(--cs-text-sm);
        text-align: left;
      }
      .ib-menu .opt:hover {
        background: var(--cs-hover);
      }
      .ib-menu .sep {
        height: 1px;
        background: var(--cs-border);
        margin: var(--cs-space-1) calc(-1 * var(--cs-space-1));
      }
      .ib-menu input {
        width: 100%;
        height: 30px;
        border: 1px solid var(--cs-border-control);
        border-radius: var(--cs-radius);
        background: var(--cs-inset);
        color: var(--cs-fg);
        font: var(--cs-text-sm) var(--cs-font-sans);
        padding: 0 var(--cs-space-2);
      }
      .ib-menu input::placeholder {
        color: var(--cs-muted-fg);
      }
      .ib-menu input:focus {
        outline: 2px solid var(--cs-accent);
        outline-offset: -1px;
      }
      .ib-menu .grp {
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
        padding: var(--cs-space-2) var(--cs-space-2) 2px;
      }
      .ib-menu .opt .det {
        margin-left: auto;
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
        white-space: nowrap;
      }

      /* body: split at >= 640px, stacked below */
      .ib-body {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .ib-list {
        width: 252px;
        flex: none;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--cs-border);
        min-height: 0;
      }
      .ib-thread {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .ib[data-layout="stack"] .ib-list {
        width: 100%;
        border-right: 0;
      }
      .ib[data-layout="stack"][data-view="thread"] .ib-list,
      .ib[data-layout="stack"][data-view="list"] .ib-thread {
        display: none;
      }

      /* conversation list */
      .ib-rows {
        flex: 1;
        min-height: 0;
        list-style: none;
        margin: 0;
        padding: var(--cs-space-1);
      }
      .ib-row {
        position: relative;
        display: grid;
        grid-template-columns: 28px 1fr auto;
        column-gap: 10px;
        row-gap: 1px;
        align-items: center;
        padding: 8px 8px 9px;
        border-radius: var(--cs-radius);
        cursor: default;
      }
      .ib-row:hover {
        background: var(--cs-hover);
      }
      .ib-row[aria-selected="true"] {
        background: color-mix(in srgb, var(--cs-accent) 8%, transparent);
      }
      .ib-rows:focus-visible {
        outline: none;
      }
      .ib-rows:focus-visible .ib-row.kbd-active {
        box-shadow: inset 0 0 0 2px var(--cs-accent);
      }
      .ib-row .av {
        grid-row: span 2;
        align-self: start;
        margin-top: 1px;
      }
      .ib-row .who {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font-weight: 500;
      }
      .ib-row .when {
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
        justify-self: end;
      }
      .ib-row .prev {
        grid-column: 2 / 4;
        font-size: var(--cs-text-sm);
        color: var(--cs-muted-fg);
        display: flex;
        gap: 6px;
        min-width: 0;
        align-items: center;
      }
      .ib-row.unread .who {
        font-weight: 650;
      }
      .ib-row.unread .prev {
        color: var(--cs-fg);
      }
      .ib-row.unread .when {
        color: var(--cs-link);
        font-weight: 600;
      }
      .ib-count {
        font: 600 10.5px/16px var(--cs-font-sans);
        min-width: 16px;
        padding: 0 5px;
        text-align: center;
        border-radius: var(--cs-radius-full);
        background: var(--cs-accent);
        color: var(--cs-accent-fg);
        flex: none;
      }
      .ib-row .rowact {
        position: absolute;
        right: 6px;
        top: 50%;
        translate: 0 -50%;
        display: none;
        background: var(--cs-bg);
        border-radius: var(--cs-radius);
        box-shadow: 0 0 0 1px var(--cs-border);
      }
      .ib-row:hover .rowact {
        display: flex;
      }
      .ib-row .sub {
        font-weight: 400;
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
      }

      /* avatars: neutral disc, state ring as a small dot */
      .av {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--cs-inset);
        box-shadow: inset 0 0 0 1px var(--cs-border);
        font-size: 11.5px;
        font-weight: 600;
        color: var(--cs-muted-fg);
      }
      .av.sm {
        width: 22px;
        height: 22px;
        font-size: 10px;
      }
      .av .ib-face {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        object-fit: cover;
        display: grid;
        place-items: center;
      }
      .av.role {
        border-radius: var(--cs-radius);
      }
      .av.you {
        background: color-mix(in srgb, var(--cs-accent) 14%, var(--cs-bg));
        color: var(--cs-accent);
        box-shadow: none;
      }
      /* State dot: 9px with a pane-coloured ring; the shape carries the state, since the
         kit gives idle, offline and exited one colour. */
      .av .st {
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 2px solid var(--cs-bg);
        background: var(--cs-state-unknown);
        display: grid;
        place-items: center;
        font: 700 8px/1 var(--cs-font-sans);
        color: var(--cs-bg);
      }
      .st.running {
        background: var(--cs-state-running);
      }
      .st.idle {
        background: var(--cs-bg);
        box-shadow: inset 0 0 0 1.5px var(--cs-state-idle);
      }
      .st.offline,
      .st.unknown {
        background: var(--cs-bg);
      }
      .st.offline::before,
      .st.unknown::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px dashed var(--cs-state-offline);
      }
      .st.unknown {
        opacity: 0.5;
      }
      .st.exited {
        border-radius: 3px;
        width: 11px;
        height: 11px;
        background: var(--cs-state-exited);
      }
      .st.needs-you {
        width: 15px;
        height: 15px;
        background: var(--ib-needs);
      }
      .st.needs-you::after {
        content: "?";
      }
      .st.failed {
        width: 15px;
        height: 15px;
        background: var(--cs-state-failed);
      }
      .st.failed::after {
        content: "×";
      }
      @media (prefers-reduced-motion: no-preference) {
        .st.running {
          animation: ib-breathe 2s ease-in-out infinite;
        }
        @keyframes ib-breathe {
          50% {
            opacity: 0.55;
          }
        }
      }

      /* notices */
      .ib-notice {
        display: flex;
        gap: var(--cs-space-2);
        align-items: flex-start;
        margin: var(--cs-space-2) var(--cs-space-2) 0;
        padding: 8px 10px;
        border-radius: var(--cs-radius);
        font-size: var(--cs-text-sm);
        background: color-mix(in srgb, var(--cs-danger) 9%, var(--cs-bg));
        color: var(--cs-fg);
      }
      .ib-notice.warn {
        background: color-mix(in srgb, var(--cs-warning) 12%, var(--cs-bg));
      }
      .ib-notice button.link {
        color: var(--cs-link);
        font-weight: 500;
        white-space: nowrap;
      }
      .ib-notice button.link:hover {
        text-decoration: underline;
      }

      /* thread */
      .ib-th-head {
        display: flex;
        align-items: center;
        gap: var(--cs-space-2);
        height: 48px;
        padding: 0 var(--cs-space-2) 0 var(--cs-space-3);
        border-bottom: 1px solid var(--cs-border);
        flex: none;
        min-width: 0;
      }
      .ib[data-layout="stack"] .ib-th-head {
        padding-left: var(--cs-space-1);
      }
      .ib-th-head .title {
        min-width: 0;
        display: grid;
        line-height: 1.25;
      }
      .ib-th-head .name {
        font-weight: 600;
      }
      .ib-th-head .meta {
        font-size: var(--cs-text-xs);
        color: var(--cs-muted-fg);
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .ib-back {
        display: none;
      }
      .ib[data-layout="stack"] .ib-back {
        display: inline-flex;
      }
      .ib-log {
        flex: 1;
        min-height: 0;
        padding: var(--cs-space-3) var(--cs-space-4) var(--cs-space-2);
        overflow-x: hidden;
        scrollbar-gutter: stable;
      }
      .ib .ib-log:focus-visible {
        outline: 2px solid var(--cs-focus-ring);
        outline-offset: -2px;
        border-radius: 0;
      }
      .ib[data-layout="stack"] .ib-log {
        padding: var(--cs-space-3) var(--cs-space-3) var(--cs-space-2);
      }
      .ib-new {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: var(--cs-text-xs);
        color: var(--cs-accent);
        font-weight: 600;
        margin: 18px 0 0;
      }
      .ib-new::before,
      .ib-new::after {
        content: "";
        flex: 1;
        height: 1px;
        background: color-mix(in srgb, var(--cs-accent) 55%, transparent);
      }
      .ib-latest-dock {
        position: relative;
        height: 0;
        flex: none;
        z-index: 2;
      }
      .ib .ib-latest {
        position: absolute;
        left: 50%;
        bottom: 8px;
        translate: -50% 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border: 0;
        border-radius: var(--cs-radius);
        background: var(--cs-bg);
        box-shadow: 0 0 0 1px var(--cs-border);
        color: var(--cs-fg);
        font: inherit;
        font-size: var(--cs-text-sm);
        white-space: nowrap;
        cursor: pointer;
      }
      .ib .ib-latest:hover {
        background: color-mix(in srgb, var(--cs-fg) 6%, var(--cs-bg));
      }
      .ib-latest b {
        color: var(--cs-accent);
        font-weight: 600;
      }
      .ib-latest .dot,
      .ib .ib-latest svg.i {
        color: var(--cs-muted-fg);
      }
      .ib .ib-latest svg.i {
        width: 13px;
        height: 13px;
      }
      .ib[data-list="hidden"]:not([data-layout="stack"]) .ib-list {
        display: none;
      }
      /* Messages read as chat: theirs left with the avatar at the group head, mine right
         in an accent tint. Grouped bubbles drop the head and show their time on hover. */
      .ib-msg {
        display: grid;
        grid-template-columns: 26px fit-content(min(88%, 68ch)) minmax(0, 1fr);
        grid-template-areas: ". mh mh" "av bd ht" ". ft ft";
        column-gap: 8px;
        margin-top: 12px;
      }
      .ib-msg.cont {
        margin-top: 2px;
      }
      .ib-msg.mine {
        grid-template-columns: minmax(0, 1fr) fit-content(min(88%, 68ch));
        grid-template-areas: "mh mh" "ht bd" "ft ft";
      }
      .ib-msg > .av {
        grid-area: av;
        width: 26px;
        height: 26px;
        font-size: 10px;
      }
      .ib-msg.cont > .av,
      .ib-msg.cont .mh,
      .ib-msg.mine > .av,
      .ib-msg.mine .mh b {
        display: none;
      }
      .ib-msg .mh {
        grid-area: mh;
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
        margin: 0 2px 3px;
        font-size: var(--cs-text-xs);
      }
      .ib-msg.mine .mh {
        justify-content: flex-end;
      }
      .ib-msg .mh b {
        font-weight: 600;
      }
      .ib-msg .mh time,
      .ib-msg .ht {
        color: var(--cs-muted-fg);
      }
      .ib-msg .ht {
        grid-area: ht;
        align-self: center;
        padding: 0 2px;
        font-size: 10px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
      }
      .ib-msg.mine .ht {
        justify-self: end;
      }
      /* Their hover time sits in the avatar gutter, never over the bubble or an embed. */
      .ib-msg:not(.mine) .ht {
        grid-column: 1;
        grid-row: 2;
        justify-self: end;
        align-self: start;
        padding-top: 9px;
      }
      .ib-msg.html.mine .ht {
        display: none;
      }
      .ib-msg:not(.cont) .ht {
        display: none;
      }
      .ib-msg.cont:hover .ht {
        opacity: 1;
      }
      .ib-msg .bd {
        grid-area: bd;
        min-width: 0;
        overflow-wrap: anywhere;
        padding: 7px 11px;
        border: 1px solid var(--cs-border);
        border-radius: var(--cs-radius-lg);
        background: var(--cs-surface);
      }
      .ib-msg:not(.mine, .cont) .bd {
        border-top-left-radius: var(--cs-radius-sm);
      }
      .ib-msg.mine .bd {
        background: color-mix(in srgb, var(--cs-accent) 12%, var(--cs-bg));
        border-color: color-mix(in srgb, var(--cs-accent) 30%, transparent);
      }
      .ib-msg.mine:not(.cont) .bd {
        border-top-right-radius: var(--cs-radius-sm);
      }
      .ib-msg.first-new .bd {
        border-color: color-mix(in srgb, var(--cs-accent) 45%, transparent);
      }
      .ib-msg.needs .bd {
        border-color: color-mix(in srgb, var(--ib-needs) 45%, transparent);
        box-shadow: inset 3px 0 0 var(--ib-needs);
        padding-left: 13px;
      }
      .ib-msg.plain-msg .bd {
        background: var(--cs-inset);
        border-style: dashed;
        font: 12px/1.55 var(--cs-font-mono);
      }
      .ib-msg.html .bd {
        grid-column: 2 / -1;
        padding: 0;
        border: 0;
        background: none;
      }
      .ib-msg.html.mine .bd {
        grid-column: 1 / -1;
      }
      .ib-msg .bd p {
        margin: 0 0 0.6em;
      }
      .ib-msg .bd p:last-child {
        margin-bottom: 0;
      }

    <script>
      (() => {
        const cs = window.codesense;
        const $ = (id) => document.getElementById(id);
        const pane = $("inbox");
        const human = "human";
        // The strip's seed: recents come first, padded with these. [emoji, CLDR name, tone-able]
        const QUICK_REACTIONS = [
          ["👍", "thumbs up", 1],
          ["✅", "check mark button", 0],
          ["👀", "eyes", 0],
          ["❤️", "red heart", 0],
          ["😂", "face with tears of joy", 0],
          ["🙏", "folded hands", 1],
        ];
        const TONE_NAMES = ["Default", "Light", "Medium-light", "Medium", "Medium-dark", "Dark"];
        let reactionRecents = [],
          skinTone = 0,
          agentDefinitions = [];
        let listHidden = false;
        const readHolds = new Map();
        let conversations = [];
        const history = new Map();
        let summarySignatures = new Map();
        let messages = [],
          sessions = [],
          roles = [],
          threads = [];
        let pendingIntent,
          contextTeam,
          replyMessageKey = null,
          targetId = null,
          targetFading = false,
          tintTimer,
          clearTintTimer;
        let crossTeam = false,
          contextOrg,
          activeTeam,
          allTeams = [],
          filterTeam = null,
          savedFilterTeam = null,
          composeTeam;
        if (cs.onFocusIn)
          cs.onFocusIn(() => {
            if (!pane.contains(document.activeElement))
              $("conversations").focus({ preventScroll: true });
          });
        let teamRoles = new Map();
        const contextReady = cs.context().then((ctx) => {
          contextTeam = ctx.team;
          contextOrg = ctx.org;
          crossTeam = ctx.inboxScope === "all-teams";
          activeTeam = ctx.activeTeam || { org: ctx.org, team: ctx.team };
          allTeams = ctx.inboxTeams || [];
          if (crossTeam) pane.dataset.mode = "all";
          layout();
        });
        let navigation = 0;
        let selected = null,
          active = null,
          recipient = "",
          drafts = {},
          hiddenSent = [],
          sentArchivedThrough = {};
        let visible = false,
          loaded = false,
          dirty = true,
          refreshing = false,
          sending = false;
        let refreshTimer,
          saveTimer,
          offSessions,
          readDone = false,
          newIds = new Set();
        // Others' mail that landed below the reader while scrolled up: counted by
        // Jump to latest and held unread until they jump or scroll back down.
        // Architecture: an explicit Mark as unread survives refresh, layout and passive scrolling.
        const explicitlyUnread = new Set();
        let held = new Set(),
          logScope = null,
          logNewest = -Infinity;
        let lastLoaded,
          archiveError = null,
          pendingArchive = new Set();
        let presence = { status: "online", note: "" },
          presenceChoice = "online";
        let prefsReady = false,
          savedRevision = 0;

        function h(tag, cls, text) {
          const node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text != null) node.textContent = text;
          return node;
        }
        function icon(name) {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "i");
          svg.setAttribute("aria-hidden", "true");
          const use = document.createElementNS(svg.namespaceURI, "use");
          use.setAttribute("href", "#i-" + name);
          svg.append(use);
          return svg;
        }
        function button(label, cls, fn, glyph) {
          const b = h("button", cls);
          b.type = "button";
          b.setAttribute("aria-label", label);
          if (glyph) b.append(icon(glyph));
          else b.textContent = label;
          b.onclick = fn;
          return b;
        }
        // Decoration screen readers skip: the label on its control says it.
        function decor(tag, cls, text) {
          const node = h(tag, cls, text);
          node.setAttribute("aria-hidden", "true");
          return node;
        }
        const teamKey = (team) => JSON.stringify([team.org, team.team]);
        const sameTeam = (a, b) => !!a && !!b && teamKey(a) === teamKey(b);
        const messageKey = (m) =>
          crossTeam ? JSON.stringify([m.team.org, m.team.team, m.messageId]) : m.messageId;
        const historyKey = (key, team) => JSON.stringify([key, teamKey(team)]);
        const summarySignature = (c) => JSON.stringify([c.messageCount, c.lastMessageId, c.unread]);
        const inConversation = (m, c) =>
          m.conversation === c.with && (!crossTeam || sameTeam(m.team, c.team));
        const hiddenMessage = (m) =>
          // Preserve archives saved by older panes; new archives use one watermark per conversation.
          hiddenSent.includes(messageKey(m)) ||
          (m.from === human &&
            m.messageId <= sentArchivedThrough[historyKey(m.conversation, m.team || activeTeam)]);
        const participant = (key) => (crossTeam && key?.startsWith("[") ? JSON.parse(key)[2] : key);
        const conversationKey = (key, team) =>
          crossTeam && key !== human && !isRole(key)
            ? JSON.stringify([team.org, team.team, key])
            : key;
        const writeTeam = (team) => (crossTeam ? team : {});
        const distinctTeams = (ms) => [
          ...new Map(ms.map((m) => [teamKey(m.team), m.team])).values(),
        ];
        const teamLabel = (team) =>
          allTeams.some((t) => t.team === team.team && t.org !== team.org)
            ? team.org + " › " + team.team
            : team.team;
        const threadTeams = (t) =>
          crossTeam
            ? distinctTeams([
                ...(t.messages || []),
                ...(t.summaries || []).map((c) => ({ team: c.team })),
              ])
            : [];
        const threadLabel = (t) => {
          const ts = threadTeams(t);
          return ts.length > 1 ? ts.length + " teams" : ts.length ? teamLabel(ts[0]) : "";
        };
        const rolesFor = (team) => teamRoles.get(teamKey(team)) || [];
        const currentRoles = () => (crossTeam ? rolesFor(composeTeam || activeTeam) : roles);
        const batchArgs = (batch) => ({
          ...writeTeam(batch[0].team),
          messageIds: batch.map((m) => m.messageId),
        });
        function teamTag(team) {
          const n = h("span", "ib-team", teamLabel(team));
          n.title = teamLabel(team);
          return n;
        }
        function eligibleMessages() {
          return messages.filter(
            (m) => !m.archivedAtMs && !hiddenMessage(m) && !pendingArchive.has(messageKey(m)),
          );
        }
        function teamBatches(ms) {
          const groups = new Map();
          for (const m of ms) {
            const key = crossTeam ? teamKey(m.team) : "";
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(m);
          }
          return [...groups.values()];
        }
        const cap = (text) => text.charAt(0).toUpperCase() + text.slice(1);
        const time = (ms) =>
          new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const GROUP_MS = 5 * 60_000;
        const dayKey = (ms) => new Date(ms).toDateString();
        function dayLabel(ms) {
          const day = new Date(ms),
            today = new Date();
          if (dayKey(ms) === today.toDateString()) return "Today";
          if (
            dayKey(ms) ===
            new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1).toDateString()
          )
            return "Yesterday";
          return day.toLocaleDateString([], {
            weekday: "short",
            day: "numeric",
            month: "short",
            ...(day.getFullYear() === today.getFullYear() ? {} : { year: "numeric" }),
          });
        }
        const isRole = (key) => key.startsWith("#");
        const session = (key) => sessions.find((s) => s.handle === participant(key));
        function label(key) {
          key = participant(key);
          if (key === human) return "You";
          if (isRole(key)) return key;
          const m = messages.find((m) => m.from === key || m.to === key);
          return session(key)?.displayName || (m?.from === key ? m.fromName : m?.toName) || key;
        }
        function toKey(m) {
          if (m.to === human) return human;
          if (m.to.startsWith("role:")) return "#" + m.to.slice(5);
          return m.delivery || roles.some((r) => r.role === m.to)
            ? "#" + m.to.replace(/^#/, "")
            : m.to;
        }
        function replyTarget(m) {
          const raw = m.replyTo && m.replyTo !== human ? m.replyTo : m.from;
          return raw.startsWith("role:") ? "#" + raw.slice(5) : raw;
        }
        function defaultRecipient(t) {
          if (!t.messages.length) return participant(t.key);
          if (crossTeam && isRole(t.key)) return t.key;
          const lastInbound = [...t.messages].reverse().find((m) => m.toHuman && m.from !== human);
          return lastInbound ? replyTarget(lastInbound) : toKey(t.last);
        }
        const currentThread = () => threads.find((t) => t.key === selected);
        const isNewThread = (key) => key === "__new__" || key?.startsWith("__new__:");
        const draftKey = (key = selected) => (key?.startsWith("__new__:") ? key.slice(8) : key);
        // Architecture: Reply on a message keeps that message's Reply-To and thread provenance.
        const parentMessage = () =>
          currentThread()?.messages.find((m) => messageKey(m) === replyMessageKey) ??
          [...(currentThread()?.messages || [])]
            .reverse()
            .find(
              (m) => m.toHuman && m.from !== human && (!crossTeam || sameTeam(m.team, composeTeam)),
            );
        const unread = (m) =>
          m.toHuman && m.to === human && m.from !== human && m.unread && !m.archivedAtMs;
        function preview(m) {
          return (
            m.summary?.trim() ||
            (m.contentType === "html"
              ? "HTML message"
              : m.text
                  .split("\n")[0]
                  .replace(/\*\*|__|~~|`|^#+\s+|^>\s?/g, "")
                  .replace(/\*([^*\s][^*]*)\*/g, "$1")) ||
            (m.attachments?.length
              ? mediaKind(m.attachments[0]) + " · " + m.attachments[0].alt
              : "")
          );
        }
        function appendPreview(root, m, prefix = "") {
          if (!m.summary?.trim() && !m.text.trim() && m.attachments?.length) {
            root.append(
              prefix,
              h("b", "ib-media-kind", mediaKind(m.attachments[0])),
              " · " + m.attachments[0].alt,
            );
          } else root.append(prefix + preview(m));
        }
        function visibleConversations(includePending = false) {
          return conversations.filter((c) => {
            if (c.lastMessageId <= sentArchivedThrough[historyKey(c.with, c.team)]) return false;
            const local = messages.filter(
              (m) =>
                !m.archivedAtMs &&
                m.conversation === c.with &&
                (!crossTeam || sameTeam(m.team, c.team)),
            );
            return (
              local.length < c.messageCount ||
              local.some(
                (m) => !hiddenMessage(m) && (includePending || !pendingArchive.has(messageKey(m))),
              )
            );
          });
        }
        function rebuildThreads() {
          if (loaded && crossTeam && filterTeam) {
            const available = visibleConversations(true);
            if (available.length && !available.some((c) => sameTeam(c.team, filterTeam)))
              filterTeam = null;
          }
          const groups = new Map();
          const unreadConversations = new Set();
          for (const m of [...messages].sort(
            (a, b) => a.createdAtMs - b.createdAtMs || a.messageId - b.messageId,
          )) {
            if (m.archivedAtMs || hiddenMessage(m) || pendingArchive.has(messageKey(m))) continue;
            const key = conversationKey(m.conversation, m.team);
            if (crossTeam && filterTeam && !sameTeam(m.team, filterTeam)) continue;
            if (!groups.has(key)) groups.set(key, { key, messages: [], summaries: [] });
            groups.get(key).messages.push(m);
          }
          for (const c of visibleConversations()) {
            const key = conversationKey(c.with, c.team);
            if (c.unread) unreadConversations.add(key);
            if (crossTeam && filterTeam && !sameTeam(c.team, filterTeam)) continue;
            if (!groups.has(key)) groups.set(key, { key, messages: [], summaries: [] });
            groups.get(key).summaries.push(c);
          }
          cs.setBadge(unreadConversations.size ? { count: unreadConversations.size } : null);
          threads = [...groups.values()]
            .map((t) => {
              const last = t.summaries.reduce(
                (latest, c) => (!latest || c.lastAt > latest.lastAt ? c : latest),
                null,
              );
              return {
                ...t,
                last: (t.messages.at(-1)?.createdAtMs >= (last?.lastAt ?? 0)
                  ? t.messages.at(-1)
                  : null) || {
                  messageId: last.lastMessageId,
                  createdAtMs: last.lastAt,
                  team: last.team,
                  from: last.with,
                  to: human,
                  text: last.lastPreview,
                  summary: last.lastPreview,
                  toHuman: true,
                },
                unread: t.summaries.reduce((n, c) => n + c.unread, 0),
                messageCount: t.summaries.reduce((n, c) => n + c.messageCount, 0),
              };
            })

                  const faces = (list) =>
                    JSON.stringify(list.map((a) => [a.key, a.name, a.avatar]));
                  if (faces(next) === faces(agentDefinitions)) return;
                  agentDefinitions = next;
                  if (visible) drawConversationView();
                })
                .catch(() => {});
            loadAgents();
            cs.onAgentsChanged?.(loadAgents);
          }
          if (prefsReady) scheduleRefresh();
        });
        // The shell is painted and the handlers are registered: tell the host the pane is live.
        cs.ready?.();
      })();
    </script>
  </body>
</html>
