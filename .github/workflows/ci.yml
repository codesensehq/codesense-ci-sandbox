# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Further static checks and test jobs will extend this skeleton.
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check workflow policy
        run: node --test scripts/workflow-policy.node-test.mjs
      - name: Lint workflows
        run: |
          bash scripts/install-scanners.sh .cache/scanners --workflows-only
          PATH="$PWD/.cache/scanners:$PATH" bash scripts/lint-workflows.sh .github/workflows
