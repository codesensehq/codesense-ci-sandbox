# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check workflow policy
        run: node --test scripts/workflow-policy.node-test.mjs
      - name: Restore scanner archives
        # Archives named by their sha256; install-scanners verifies each against the lock before use.
        id: scanner-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: scanner-archives-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/scanners.lock') }}
      - name: Install pinned scanners
        # One run, so actionlint, zizmor and cargo-deny share the script's download budget.
        run: bash scripts/install-scanners.sh .cache/scanners --cache "$RUNNER_TEMP/scanner-archives" --workflows-only --tool cargo-deny
      - name: Save scanner archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scanner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: ${{ steps.scanner-cache.outputs.cache-primary-key }}
      - name: Lint workflows
        run: PATH="$PWD/.cache/scanners:$PATH" bash scripts/lint-workflows.sh .github/workflows
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - name: Read Rust version
        id: rustc
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: cargo-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Lint source
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Check SPDX headers
        run: node scripts/spdx-headers.mjs --check
      - name: Check licences
        env:
          CARGO_NET_OFFLINE: "true"
        run: PATH="$PWD/.cache/scanners:$PATH" node scripts/licence-scan.mjs --check
      - name: Check generated docs
        run: pnpm gen:docs:check:pr
      - name: Save Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
