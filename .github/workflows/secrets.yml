# SPDX-License-Identifier: MIT
name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned scanners
        run: |
          bash scripts/install-scanners.sh "$RUNNER_TEMP/scanners" --tool gitleaks --tool trufflehog
          echo "$RUNNER_TEMP/scanners" >> "$GITHUB_PATH"
      - name: Scan tree and change history
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/ci-secret-scan.sh
