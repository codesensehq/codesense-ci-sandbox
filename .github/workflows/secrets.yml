# SPDX-License-Identifier: MIT
name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Restore scanner archives
        # Archives named by their sha256; install-scanners verifies each against the lock before use.
        id: scanner-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: scanner-archives-secret-scan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/scanners.lock') }}
      - name: Install pinned scanners
        run: |
          bash scripts/install-scanners.sh "$RUNNER_TEMP/scanners" --cache "$RUNNER_TEMP/scanner-archives" --tool gitleaks --tool trufflehog
          echo "$RUNNER_TEMP/scanners" >> "$GITHUB_PATH"
      - name: Save scanner archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scanner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scanner-archives
          key: ${{ steps.scanner-cache.outputs.cache-primary-key }}
      - name: Scan tree and change history
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/ci-secret-scan.sh
