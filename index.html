<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Preload the terminal web font so its download starts at
         HTML-parse time and it's available to the canvas glyph atlas sooner,
         reducing the fallback-first-paint window. `crossorigin` is required for a
         font preload to be reused by the @font-face, even same-origin. -->
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="/fonts/MesloLGS-NF-Regular.ttf"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSense</title>
    <!-- Excalidraw reads a canvas's fonts from here before it tries esm.sh. The app ships them
         (scripts/vite-plugin-excalidraw-fonts.ts), so a canvas asks no outside host. -->
    <script>
      window.EXCALIDRAW_ASSET_PATH = "/excalidraw-assets/";
    </script>
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        var d = document.documentElement;
        if (t === "light") {
          d.classList.remove("dark");
        } else if (t === "dark") {
          d.classList.add("dark");
        } else {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            d.classList.add("dark");
          } else {
            d.classList.remove("dark");
          }
        }
      })();
    </script>
    <style>
      html.dark body {
        background-color: #0d1117;
        color: #e6edf3;
      }
      html:not(.dark) body {
        background-color: #ffffff;
        color: #1f2328;
      }
    </style>
  </head>

  <body style="margin: 0">
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
